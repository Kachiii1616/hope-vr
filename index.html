<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOPE しごとタウン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&family=Yuji+Syuku&display=swap">
<style>
/* 画面いっぱいの 3D の町。HTML は上の帯・下の職業チップ・左上の指示カード・右の記録だけを重ねる。 */
:root {
  --ink: #1f2a33;
  --ink-soft: #55626d;
  --paper: #f6f8f4;
  --card: rgba(255, 255, 255, 0.92);
  --line: #d5ddd3;
  --accent: #e0662f;      /* しごとタウンの目印（夕方の看板色） */
  --accent-ink: #ffffff;
  --ok: #2f7d4f;
  --ng: #b93a32;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eee9; --ink-soft: #a9b6b0; --paper: #141a1d; --card: rgba(24, 31, 35, 0.92);
    --line: #33413f; --accent: #f08a52; --accent-ink: #1b1209; --ok: #6cc28e; --ng: #ef7a70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eee9; --ink-soft: #a9b6b0; --paper: #141a1d; --card: rgba(24, 31, 35, 0.92);
  --line: #33413f; --accent: #f08a52; --accent-ink: #1b1209; --ok: #6cc28e; --ng: #ef7a70;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.hud { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }
.top {
  top: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-left: 8px; letter-spacing: 0; }
.place { font-size: 13px; color: var(--ink-soft); background: var(--card); border-radius: 999px; padding: 4px 12px; border: 1px solid var(--line); }
.spacer { flex: 1; }
button {
  font: inherit; font-weight: 700; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.instr {
  position: fixed; z-index: 2; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
  width: min(340px, calc(100% - 32px)); max-height: 42%; overflow: auto; box-sizing: border-box; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.12);
}
.instr h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 17px; text-wrap: balance; }
.instr .tag { display: inline-block; font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }
.instr ol { margin: 6px 0 0; padding-left: 1.4em; }
.instr li.done { color: var(--ink-soft); text-decoration: line-through; }
.instr li.now { font-weight: 700; color: var(--accent); }
.instr .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.instr .feedback { min-height: 1.4em; font-weight: 700; }
.instr .feedback.ok { color: var(--ok); }
.instr .feedback.ng { color: var(--ng); }
.instr .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.bottom {
  bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  scroll-padding-inline: 16px;
}
/* 帯そのものも 指を 受けないと 横に スクロールできない（.hud は 3D を さわれるよう pointer-events: none） */
.hud.bottom {
  pointer-events: auto; touch-action: pan-x; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  /* 右はしを うすくして「まだ 続く」と わかるように */
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
.hud.bottom::-webkit-scrollbar { display: none; }
/* スワイプが きかない 端末でも 送れるように、両はしに 送りボタン */
.chip-nav {
  position: fixed; z-index: 3; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 40px; height: 40px; padding: 0; border-radius: 50%;
  font-size: 22px; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
#chips-prev { left: 6px; }
#chips-next { right: 6px; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 700; }
.chip i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.chip span { font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.chip[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.log {
  position: fixed; z-index: 3; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: min(380px, calc(100% - 32px)); max-height: calc(100% - 160px); overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.log h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 17px; }
.log p.note { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); }
.log table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.log th, .log td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log th, .log td:not(:first-child) { white-space: nowrap; }
.log th { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
.log .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.log textarea { width: 100%; box-sizing: border-box; min-height: 120px; margin-top: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }

.pad {
  position: fixed; z-index: 3; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 68px);
  display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.pad[hidden] { display: none; }
.pad button { padding: 0; font-size: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.pad button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
/* オープニング・設定・買い物・バッジ帳（画面の まんなかの カード） */
.modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 25, 30, .38); }
.modal[hidden] { display: none; }
.modal-card {
  width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; box-sizing: border-box;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; box-shadow: 0 16px 48px rgba(0,0,0,.25);
}
.modal-card h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; text-wrap: balance; }
.modal-card p { margin: 4px 0 10px; color: var(--ink-soft); }
.modal-card label.field { display: block; font-weight: 700; margin: 14px 0 6px; }
.modal-card input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choices label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--card); cursor: pointer; }
.choices label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choices small { display: block; font-weight: 400; color: var(--ink-soft); }
.modal-card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
/* キャラメイク（左に 見本、右に えらぶ ところ。せまい 画面では 上下） */
.modal-card.wide { width: min(780px, 100%); }
.look-wrap { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; gap: 14px; align-items: start; }
.look-view { position: sticky; top: 0; }
.look-view canvas { display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 14px; background: #dfe8ee; touch-action: none; cursor: grab; }
.look-view small { display: block; text-align: center; color: var(--ink-soft); font-size: 12px; }
.look-opts .field { font-weight: 700; margin: 10px 0 4px; }
.look-opts .field:first-child { margin-top: 0; }
.look-row { display: flex; gap: 6px; flex-wrap: wrap; }
.look-row button { padding: 5px 10px; font-size: 14px; }
.look-row button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.look-row .swatch { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid var(--line); }
.look-row .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); border-color: #ffffff; }
@media (max-width: 560px) { .look-wrap { grid-template-columns: 1fr; } .look-view { position: static; width: min(200px, 60%); margin: 0 auto; } }
.pick-list { display: grid; gap: 8px; margin-top: 8px; }
/* 作業一覧（画面いっぱい） */
.modal.full { padding: 0; }
.modal-card.full { width: 100%; height: 100%; max-height: none; border-radius: 0; padding: 16px; display: flex; flex-direction: column; }
.joblist-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.joblist-head h2 { margin: 0; flex: 1 1 auto; }
.joblist-head [aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.joblist-body { flex: 1 1 auto; overflow: auto; margin-top: 10px; }
.joblist-body h3 { font-size: 15px; margin: 14px 0 6px; color: var(--ink-soft); }
.job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.job-card { text-align: left; padding: 12px 14px 12px 16px; border-left: 8px solid var(--c); min-height: 92px; display: flex; flex-direction: column; gap: 4px; }
.job-card b { font-size: 18px; }
.job-card .shop { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.job-card small { font-weight: 400; color: var(--ink-soft); line-height: 1.45; }
.job-card[aria-current="true"] { outline: 3px solid var(--accent); }
.pick-list button { text-align: left; padding: 10px 14px; }
.pick-list button small { display: block; font-weight: 400; color: var(--ink-soft); }
.pick-list button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.area-map { display: block; width: 100%; aspect-ratio: 850 / 680; border-radius: 12px; cursor: pointer; touch-action: manipulation; margin-top: 6px; }
.area-desc { min-height: 1.5em; }
.area-list { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.area-list button { display: flex; gap: 10px; align-items: flex-start; }
.area-list button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.area-no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 2px solid var(--accent); color: var(--accent); }
.area-list button[aria-pressed="true"] .area-no { background: var(--accent); color: var(--accent-ink); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.shop-grid .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.shop-grid .item b { font-size: 15px; }
.shop-grid .item span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.badge-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.badge-table td, .badge-table th { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
.medal { display: inline-block; min-width: 2.4em; text-align: center; border-radius: 999px; padding: 1px 8px; font-weight: 700; color: #1f2a33; }
.wallet { font-variant-numeric: tabular-nums; }

/* 右上の 島の 地図（いまの 場所と 向き・お店を タップで 移動） */
.minimap {
  position: fixed; z-index: 2; right: 12px; top: 64px; width: 210px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.minimap-bar { display: flex; gap: 4px; align-items: center; }
.minimap-size { border: 0; background: none; padding: 2px 6px 4px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.minimap.big { width: min(460px, calc(100vw - 24px)); }
.minimap.closed .minimap-size { display: none; }
.minimap-head { flex: 1; width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 2px 6px 4px; font-size: 12px; }
.minimap canvas { display: block; width: 100%; aspect-ratio: 850 / 680; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
.minimap.closed { width: auto; }
.minimap.closed canvas { display: none; }
@media (max-width: 560px) { .minimap { width: 150px; right: 8px; } }
.toast { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 999px; font-size: 13px; }

@media (max-width: 560px) {
  .brand small { display: none; }
  .instr { padding: 10px 12px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage" aria-label="しごとタウンの 3D 表示。ドラッグで見回し、タップでえらぶ"></div>

<header class="hud top">
  <div class="brand">HOPE しごとタウン<small>職業体験 VR 下書き</small></div>
  <div class="place" id="place">島ぜんたい</div>
  <div class="place wallet" id="wallet" hidden></div>
  <div class="spacer"></div>
  <button id="btn-home" type="button" hidden>家</button>
  <button id="btn-jobs" type="button" class="primary">作業一覧</button>
  <button id="btn-walk" type="button">島を歩く</button>
  <button id="btn-season" type="button">季節：夏</button>
  <button id="btn-log" type="button">きろく</button>
  <button id="btn-settings" type="button">設定</button>
  <button id="btn-vr" type="button" class="primary" hidden>VR で入る</button>
</header>

<section class="instr" id="instr" aria-live="polite"></section>

<aside class="log" id="log" hidden>
  <h2>体験のきろく</h2>
  <p class="note">hope-work の「② 作業体験」の場面（配慮なし／配慮あり）と同じ項目で残します。このブラウザの中だけに保存します。</p>
  <div style="overflow-x:auto"><table id="log-table"></table></div>
  <div class="actions">
    <button id="btn-copy" type="button">JSON をコピー</button>
    <button id="btn-clear" type="button">きろくを消す</button>
    <button id="btn-log-close" type="button">とじる</button>
  </div>
  <textarea id="log-json" readonly aria-label="記録の JSON" hidden></textarea>
</aside>

<nav class="hud bottom" id="chips" aria-label="職業をえらぶ"></nav>
<div class="minimap" id="minimap">
  <div class="minimap-bar"><button type="button" class="minimap-head" id="minimap-toggle" aria-expanded="true">島の 地図 <span aria-hidden="true">−</span></button><button type="button" class="minimap-size" id="minimap-size">大きく</button></div>
  <canvas id="minimap-canvas" role="img" aria-label="島ぜんたいの 地図。お店の 点を タップすると その お店へ 行きます"></canvas>
</div>
<button type="button" class="chip-nav" id="chips-prev" aria-label="前の お店へ 送る" hidden>‹</button>
<button type="button" class="chip-nav" id="chips-next" aria-label="つぎの お店へ 送る" hidden>›</button>
<div class="pad" id="pad" hidden aria-label="歩くボタン">
  <button type="button" class="up" data-key="fwd" aria-label="前へ">▲</button>
  <button type="button" class="left" data-key="left" aria-label="左を向く">◀</button>
  <button type="button" class="down" data-key="back" aria-label="うしろへ">▼</button>
  <button type="button" class="right" data-key="right" aria-label="右を向く">▶</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden><div class="modal-card" id="modal-card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function main() {
'use strict';

// ===========================================================================
// 職業の定義
//   1 回 = 1 個の完成。round() が「指示」「並べる道具」「正しく選ぶ順番」を返す。
//   ordered: true なら順番どおり、false なら順不同でぜんぶ選ぶ。
//   hope-work の作業マスタ（手順・不良基準）に合わせられるよう、手順は steps に持つ。
// ===========================================================================
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (arr, n) => shuffle(arr).slice(0, n);

const ROUNDS_PER_SESSION = 5;

// 漁協の 仕分け：リアス式海岸（三陸の 岩の 多い 入り江）で とれる 魚。① 種類を 見分ける → ② ものさしで 大きさ → ③ A・B の 大・小の 箱へ
//   line は 大・小の さかい（cm）。feats は 種類の カードに 書く 見分けかた
const FISH_SORT_INTRO = 'リアス式海岸の 入り江で とれた 魚を 仕分けます。① カードを 見て 魚の 種類を えらぶ → ② ものさしで 大きさを きめる → ③ A・B の 大・小の 箱に 入れる。';
const SORT_FISH = {
  summer: [
    { name: 'アイナメ', shape: 'long', color: '#8a6a3a', line: 30, small: [20, 26], big: [33, 40], feats: ['体が 細長い', '茶色で まだら もよう', '背びれが 長く つづく'] },
    { name: 'メバル', shape: 'tall', color: '#5a4a4f', line: 20, small: [13, 17], big: [22, 27], feats: ['目が とても 大きい', '体が 高く まるっこい', '背びれに トゲ'] },
  ],
  winter: [
    { name: 'マダラ', shape: 'cod', color: '#a89a7a', line: 50, small: [35, 45], big: [55, 68], feats: ['あごに ひげが 1本', 'おなかが ふくらむ', '茶色の まだら もよう'] },
    { name: 'マコガレイ', shape: 'flat', color: '#7a6a4a', line: 25, small: [17, 22], big: [28, 34], feats: ['体が 平たい', '目が 2つとも 上の がわ', 'うらがわは 白い'] },
  ],
};
function fishSortRound(season) {
  const pair = SORT_FISH[season]; const k = Math.floor(Math.random() * 2); const f = pair[k]; const big = Math.random() < 0.5;
  const [lo, hi] = big ? f.big : f.small; const cm = lo + Math.floor(Math.random() * (hi - lo + 1));
  const items = pair.map((p) => ({ label: p.name, step: 1 })).concat([{ label: '大きい', step: 2 }, { label: '小さい', step: 2 }]);
  ['A', 'B'].forEach((g) => ['大', '小'].forEach((z) => items.push({ label: g + '・' + z, step: 3 })));

// IT企業：伝票と 表を くらべる（行ごとに 合っていれば ✓、ちがえば 数に 線）
function laptopRound(pool, rightTitle) {
  const rows = sample(pool, 4).map((f) => ({ f, n: 1 + Math.floor(Math.random() * 10) }));
  const wrong = sample([0, 1, 2, 3], 1 + Math.floor(Math.random() * 2)).sort();
  rows.forEach((r, i) => { r.shown = r.n; if (wrong.includes(i)) { r.shown = r.n + pick([-3, -2, -1, 1, 2, 3]); if (r.shown < 1) r.shown = r.n + 2; } });
  // まちがっている 行だけ ✓。行は 好きな 順で よい（free）、さいごに「チェック おわり」
  const items = rows.map((r, i) => ({ label: '', id: 'ng' + i, row: i, name: r.f + 'の 行に ✓' })).concat([{ label: '', id: 'done', name: 'チェック おわり' }]);
  const checks = wrong.map((i) => 'ng' + i);
  return {
    title: 'まちがっている 行だけ □ に ✓', shortTitle: 'まちがっている 行だけ □ に ✓', carryText: '伝票と ' + rightTitle + 'を くらべる。ぜんぶ 見たら「チェック おわり」',
    items, need: checks.concat(['done']), free: checks, ordered: true, hideSteps: true, layout: 'laptop', rows, rightTitle,
  };
}

  if (ISLE.rects.concat(ISLE.noWalk || []).some(([x0, x1, z0, z1]) => x > x0 - R && x < x1 + R && z > z0 - R && z < z1 + R)) return false;
  if (blocked.some((b) => b.w > 0 && Math.hypot(b.x - x, b.z - z) < b.w + WALKER_R)) return false;
  const onRoad = roadSegs.some(([a, b]) => segDist(x, z, a, b) < ROAD_W / 2);
  return onRoad || !riverSegs.some(([a, b, w]) => segDist(x, z, a, b) < w / 2 + 0.1);
}

// 道ぞいに 建てる：near（地図 px）に いちばん 近い 道を さがし、正面を その 道に 向ける。
//   face が あれば 向きは その 方角に きめ、その 方向に ある 道まで 出す。
//   foot は 道の 中心線の 上の 点、front は 建物から 道への 向き。
function roadside(near, face) {
  const p = toWorld(...near); let foot = null; let front = null;
  if (face) {
    const yaw = FACE[face]; front = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)); let best = Infinity;
    const far = p.clone().addScaledVector(front, 200);
    roadSegs.forEach(([a, b]) => { const x = crossPoint(p, far, a, b); if (x && x.distanceTo(p) < best) { best = x.distanceTo(p); foot = x; } });
  } else {
    let best = Infinity; let seg = null;
    roadSegs.forEach(([a, b]) => { const d = segDist(p.x, p.z, a, b); if (d < best) { best = d; seg = [a, b]; } });
    const [a, b] = seg; const ab = b.clone().sub(a); const t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
    foot = a.clone().addScaledVector(ab, t);
    front = t > 0 && t < 1 ? new THREE.Vector3(-ab.z, 0, ab.x).normalize() : foot.clone().sub(p).normalize(); // 道の 端なら 端に 向く
    if (front.dot(foot.clone().sub(p)) < 0) front.negate();
  }
  return { foot, front, yaw: Math.atan2(front.x, front.z) };
}
// お店の 場所：pos は 奥の 壁（お店の 原点）、at は 地図に 点を 打つ ところ（お店の まん中）
Object.values(SITES).forEach((s) => {
  const r = roadside(s.near, s.face); s.yaw = r.yaw;
  s.pos = r.foot.clone().addScaledVector(r.front, -(s.set || SHOP_SET));
  s.at = toMap(s.pos.x + r.front.x * 0.9, s.pos.z + r.front.z * 0.9);
});

// 毎回同じ町になるよう、決まった順の乱数で散らす
let seed = 20260616;
const rand = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
function scatter(cx, cy, rx, ry, count, r, make, walkR) {
  let placed = 0;
  for (let tries = 0; tries < count * 40 && placed < count; tries++) {
    const a = rand() * Math.PI * 2; const d = Math.sqrt(rand());
    const p = toWorld(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d);
    if (!isFree(p.x, p.z, r)) continue;
    block(p.x, p.z, r, walkR); make(p.x, p.z, placed); placed++;
  }
}

// 平らな地面の色分け（地図の px の多角形）
function pxShape(points) {
  const s = new THREE.Shape();
  points.forEach(([x, y], i) => { const v = toWorld(x, y); if (i) s.lineTo(v.x, -v.z); else s.moveTo(v.x, -v.z); });
  return s;
}
function ellipse(cx, cy, rx, ry, n) { const out = []; for (let i = 0; i < (n || 28); i++) { const a = (i / (n || 28)) * Math.PI * 2; out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return out; }
function patch(points, color, y) {
  const m = new THREE.Mesh(new THREE.ShapeGeometry(pxShape(points)), cmat(color));
  m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m;
}
function addBox(x, y, z, w, h, d, color, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'string' ? cmat(color) : color);
  m.position.set(x, y, z); if (ry) m.rotation.y = ry; scene.add(m); return m;
}
function addCyl(x, y, z, rt, rb, h, color, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), cmat(color));
  m.position.set(x, y, z); scene.add(m); return m;
}

  [[752, 505, 40], [788, 560, 45]].forEach(([cx, cy, deg]) => {

    m.rotation.x = -Math.PI / 2; m.rotation.z = Math.atan2(b.x - a.x, b.z - a.z);
    m.position.set((a.x + b.x) / 2, 0.09, (a.z + b.z) / 2); scene.add(m);
    const j = new THREE.Mesh(new THREE.CircleGeometry(ROAD_W / 2, 16), cmat('#a9a49a'));

function overviewSign(text, sub, color, w) {

function buildShopShell(g, job) {

  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); g.add(o); return o; };
  const floorColor = { rink: '#cfe3ee', yatai: '#d9c4a2', super: '#e9e6dc', school: '#b98f5a', fish: '#cfd8dc', forest: '#9c7a54', ski: '#d9dde3', logi: '#b9bcb8', store: '#e9e6dc', clean: '#d9cdb8', cafe: '#a87b55', care: '#d8c3a0', office: '#c9ccd3', farm: '#8f7a5a', craft: '#c4a27a', hut: '#9c7a54', wind: '#c9ccd3', it: '#c9ccd3', rice: '#8a7a52' }[job.id] || '#d9cdb8';

// ===========================================================================
// 道具（作業で選ぶもの）の形
//   見ただけで「お茶」「パン」と わかるように、品物ごとに 部品を 組み立てる。
//   どの モデルも 底が y = 0。SHAPE_MODELS（形）→ ITEM_MODELS（品名）→ 基本の形 の順に さがす。
// ===========================================================================
const TAU = Math.PI * 2;
// 部品を 1 つ足す。x, y, z は部品の中心。
function part(g, geo, color, x, y, z, extra) {
  const m = new THREE.Mesh(geo, mat(color, extra)); m.position.set(x, y, z); g.add(m); return m;
}
const cyl = (rt, rb, h, seg) => new THREE.CylinderGeometry(rt, rb, h, seg || 20);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const ball = (r, ws, hs) => new THREE.SphereGeometry(r, ws || 18, hs || 12);
// 大きさを w × h × d に おさめる（たなに 小さく 並べるとき・手に 持つとき）
function fitInto(obj, w, h, d) {
  const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  const s = Math.min(w / size.x, h / size.y, (d || w) / size.z, 1);
  obj.scale.multiplyScalar(s);
  return obj;
}

// ペットボトル（お茶・水・ジュース）
function bottle(liquid, label, cap, clear) {
  const g = new THREE.Group();
  const glass = clear ? { transparent: true, opacity: 0.55, roughness: 0.15 } : { roughness: 0.3 };
  part(g, cyl(0.04, 0.04, 0.15), liquid, 0, 0.075, 0, glass);
  part(g, cyl(0.0415, 0.0415, 0.075), label, 0, 0.085, 0);
  part(g, cyl(0.0418, 0.0418, 0.012), '#ffffff', 0, 0.1, 0);
  part(g, cyl(0.017, 0.04, 0.04), liquid, 0, 0.17, 0, glass);
  part(g, cyl(0.016, 0.016, 0.014), '#e9eef0', 0, 0.197, 0, { transparent: true, opacity: 0.7 });
  part(g, cyl(0.019, 0.019, 0.024, 16), cap, 0, 0.214, 0);
  return g;
}

// 品物の バーコード（白い 札に 黒い 線）。flat は 上向き（ふたの 上）
function barcode(g, x, y, z, w, h, flat) {
  const b = new THREE.Group(); b.position.set(x, y, z); if (flat) b.rotation.x = -Math.PI / 2; g.add(b);
  part(b, box(w, h, 0.001), '#ffffff', 0, 0, 0);
  for (let i = 0; i < 9; i++) part(b, box(w * (i % 3 ? 0.03 : 0.06), h * 0.7, 0.0012), '#1f2a33', -w * 0.4 + i * w * 0.1, h * 0.05, 0.0005);
  return b;
}

      part(half, new THREE.TorusGeometry(0.022, 0.006, 8, 20), '#e0662f', -0.03, 0.006, sd * 0.022).rotation.x = Math.PI / 2;

// 人（カフェの お客さま・介護施設の 利用者）
//   イラスト風：大きめの 頭・黒目に 白い ひかり・ピンクの ほっぺ・にっこり 口・ななめの 前髪・丸首の セーター。
//   正面は +z。hair は PERSON_HAIRS の キー（'short' みじかい・'bob' ボブ など）。書かなければ 服の 色で 'bob' か 'short'（町の 人が ばらけるように）。
//   look（キャラメイク）：{ skin, hairColor, eyes }。書かなければ ふつうの 見た目
const PERSON_SKIN = '#f3dbc8';
const PERSON_INK = '#3a2c27';
// セーターの 形（まるい たまご形。すそと 肩は 角を 丸める）。[はんけい, 高さ]。前後は PERSON_DEPTH で 少し うすく
const PERSON_PROFILE = [[0, 0.088], [0.05, 0.088], [0.06, 0.091], [0.065, 0.098], [0.0665, 0.11], [0.065, 0.15], [0.06, 0.18], [0.053, 0.199], [0.043, 0.212], [0.03, 0.221], [0.017, 0.226], [0, 0.228]];
const PERSON_DEPTH = 0.86;
const PERSON_BODY = new THREE.LatheGeometry(PERSON_PROFILE.map(([x, y]) => new THREE.Vector2(x, y)), 36);
// えりもと：丸首（首の つけねに 服と 同じ 色の 細い ふち）
const NECK_Y = 0.222; // 首の つけね
const PERSON_HEAD_Y = 0.287; // 頭の 中心（あごが えりもとに のる 高さ。首は ほとんど 見せない）
const PERSON_HEAD_R = 0.066;
const PERSON_HAIRS = { short: 'みじかい', bob: 'ボブ', long: 'ロング', pony: 'ポニーテール', twin: 'ツインテール', bun: 'おだんご' };
const PERSON_EYES = { round: 'まる', smile: 'にっこり', dot: 'てん' };
// 色を 少し こく（かげの 色）
const shade = (hex, k) => '#' + new THREE.Color(hex).multiplyScalar(k).getHexString();
function person(bodyColor, legColor, nameTag, hair, look) {
  const g = new THREE.Group();
  look = look || {};
  const SKIN = look.skin || PERSON_SKIN;
  const hairColor = look.hairColor || (nameTag ? '#d8d8d8' : '#3d2c26');
  if (!hair) hair = [...bodyColor].reduce((a, c) => a + c.charCodeAt(0), 0) % 2 ? 'bob' : 'short';
  // 足と くつ
  [-1, 1].forEach((sd) => {
    part(g, cyl(0.02, 0.02, 0.075, 16), legColor, sd * 0.024, 0.055, 0);
    part(g, ball(0.02, 16, 10), legColor, sd * 0.024, 0.093, 0); // ももの つけね（すそから 角が 見えない ように）
    part(g, ball(0.023, 16, 12), PERSON_INK, sd * 0.024, 0.011, 0.007).scale.set(1, 0.55, 1.3);
  });
  part(g, PERSON_BODY, bodyColor, 0, 0, 0).scale.z = PERSON_DEPTH;
  // うで：肩の 丸みの 内がわから 下へ。上と 下を 丸めた カプセル形（肩が こぶに ならない ように つけねは 体に うめる）
  const ARM = 0.09; const TILT = 0.2; const AR = 0.0165;
  [-1, 1].forEach((sd) => {
    const top = [sd * 0.041, 0.197];
    const end = [top[0] + sd * Math.sin(TILT) * ARM, top[1] - Math.cos(TILT) * ARM];
    part(g, ball(AR, 16, 12), bodyColor, top[0], top[1], 0);
    const arm = part(g, cyl(AR, AR, ARM, 16), bodyColor, (top[0] + end[0]) / 2, (top[1] + end[1]) / 2, 0); arm.rotation.z = sd * TILT;
    part(g, ball(AR, 16, 12), bodyColor, end[0], end[1], 0);
    part(g, ball(0.0175, 16, 12), SKIN, end[0] + sd * 0.002, end[1] - 0.012, 0.002);
  });
  // 首（みじかく。あごの 下に かくれる）と えりもと
  part(g, cyl(0.016, 0.018, 0.03, 16), SKIN, 0, 0.234, 0);
  const band = part(g, new THREE.TorusGeometry(0.0195, 0.0035, 10, 32), shade(bodyColor, 0.9), 0, NECK_Y + 0.003, 0); band.rotation.x = Math.PI / 2; band.scale.y = PERSON_DEPTH; // 丸首の ふち
  if (nameTag) part(g, box(0.05, 0.026, 0.004), '#ffffff', 0, 0.162, 0.058);
  // 頭（体より 大きめ）
  const H = PERSON_HEAD_Y; const R = PERSON_HEAD_R;
  part(g, ball(R, 36, 28), SKIN, 0, H, 0);
  [-1, 1].forEach((sd) => part(g, ball(0.012, 12, 10), SKIN, sd * 0.064, H - 0.01, -0.004).scale.set(0.6, 1, 0.9));
  // 目（顔の まん中より 少し 下・大きめ。黒目に 白い ひかり 1 つ）・ほっぺ・小さな 口
  const onFace = (x, y, off) => Math.sqrt(Math.max(0, R * R - x * x - y * y)) + off; // 顔の 表面の z
  // 顔の 表面の (x, y) に はりつく 台（z は 顔の 外むき）。目と ほっぺを ここに のせると、左右で 向きが そろう
  const onSkin = (x, y) => {
    const n = new THREE.Vector3(x, y, onFace(x, y, 0)).normalize(); const grp = new THREE.Group();
    grp.position.copy(n).multiplyScalar(R).add(new THREE.Vector3(0, H, 0)); grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n); g.add(grp); return grp;
  };
  // 顔の 表面に そった 線（口・にっこり目）。fn(t) は t = -1〜1 で 正面から 見た (x, y)。out は 線の 太さの うち 顔から 出す わりあい（のこりは 顔に うめて すきまを つくらない）
  const faceLine = (fn, r, color, out) => {
    const pts = []; for (let i = 0; i <= 16; i++) { const [x, y] = fn(-1 + i / 8); pts.push(new THREE.Vector3(x, y, onFace(x, y, 0)).normalize().multiplyScalar(R + r * (2 * out - 1)).add(new THREE.Vector3(0, H, 0))); }
    part(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, r, 8), color, 0, 0, 0);
    [pts[0], pts[pts.length - 1]].forEach((q) => part(g, ball(r, 8, 6), color, q.x, q.y, q.z)); // 線の はしを 丸く
  };
  [-1, 1].forEach((sd) => {
    const ex = sd * 0.023; const ey = -0.011;
    if (look.eyes === 'smile') { // にっこり：上に まるい 線
      faceLine((t) => [ex + 0.0085 * t, ey - 0.003 + 0.0065 * (1 - t * t)], 0.0022, '#2e2420', 0.85);
    } else if (look.eyes === 'dot') { // てん：小さな 黒目
      part(onSkin(ex, ey), ball(0.0058, 14, 10), '#2e2420', 0, 0, -0.001).scale.set(1, 1.15, 0.55);
    } else { // ひかりは 両目とも 黒目の 右上の 同じ ところ
      const eye = onSkin(ex, ey);
      part(eye, ball(0.0095, 16, 12), '#2e2420', 0, 0, -0.002).scale.set(1, 1.25, 0.55);
      part(eye, ball(0.0034, 12, 10), '#ffffff', 0.0032, 0.0048, 0.0012).scale.z = 0.5; // 横から 見ても とび出さない
    }
    // ほっぺ：顔の 丸みに ぴったり そう うすい まる（顔に しずめると ふちが ぎざぎざに なる）
    const ck = part(g, new THREE.SphereGeometry(R + 0.0006, 32, 6, 0, TAU, 0, 0.15), '#f2a7b8', 0, H, 0);
    ck.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(sd * 0.041, -0.025, onFace(sd * 0.041, -0.025, 0)).normalize());
  });
  // 口：顔に そった 小さな にっこり
  faceLine((t) => [0.0095 * t, -0.028 - 0.0055 * (1 - t * t)], 0.0022, PERSON_INK, 0.75);
  // 髪：上の かぶり（前は ひたいの 上、うしろは えりあし まで）＋ ななめの 前髪
  const top = part(g, new THREE.SphereGeometry(R + 0.006, 36, 16, 0, TAU, 0, Math.PI / 2), hairColor, 0, H, -0.002, { side: THREE.DoubleSide });
  top.rotation.x = -0.42;
  const bang = part(g, new THREE.SphereGeometry(R + 0.004, 36, 12, 0, TAU, 0, Math.PI * 0.36), hairColor, 0, H, 0, { side: THREE.DoubleSide });
  bang.rotation.set(0.32, 0, 0.3);
  if (hair === 'bob' || hair === 'long') {
    // あごの 下まで とどく 丸い ボブ（すそは 内まき。顔の 前は あける）。頭の てっぺんから 1 まいで かぶせて、上の かぶりと すきまを つくらない
    const side = part(g, new THREE.SphereGeometry(R + 0.009, 36, 18, Math.PI * 0.82, Math.PI * 1.36, 0, Math.PI * 0.78), hairColor, 0, H - 0.01, -0.002, { side: THREE.DoubleSide });
    side.scale.set(1.03, 1.1, 1);
  }
  // ロング：せなかに おちる 髪（ボブの うしろに 丸い たば）
  if (hair === 'long') part(g, ball(0.064, 32, 20), hairColor, 0, H - 0.05, -0.028).scale.set(1.06, 1.55, 0.62);
  // ポニーテール：うしろの 高い ところで むすぶ
  if (hair === 'pony') {
    part(g, ball(0.012, 14, 10), shade(hairColor, 0.8), 0, H + 0.012, -R - 0.004);
    const tail = part(g, ball(0.024, 24, 16), hairColor, 0, H - 0.03, -R - 0.016); tail.scale.set(0.85, 1.9, 0.8); tail.rotation.x = 0.18;
  }
  // ツインテール：耳の 上で 2 つに むすぶ
  if (hair === 'twin') {
    [-1, 1].forEach((sd) => {
      part(g, ball(0.011, 14, 10), shade(hairColor, 0.8), sd * (R + 0.002), H + 0.012, -0.012);
      const tail = part(g, ball(0.022, 24, 16), hairColor, sd * (R + 0.014), H - 0.026, -0.014); tail.scale.set(0.8, 1.9, 0.8); tail.rotation.z = sd * 0.15;
    });
  }
  // おだんご：頭の うしろ上に まるい たば
  if (hair === 'bun') part(g, ball(0.03, 28, 20), hairColor, 0, H + 0.05, -0.04);
  return g;
}

// 器（介護施設の おぜん用）
function bowl(g, x, z, r, h, color, food) {
  part(g, cyl(r, r * 0.65, h, 18), color, x, 0.024 + h / 2, z);
  part(g, cyl(r * 0.9, r * 0.9, 0.004, 18), food, x, 0.026 + h, z);
}

    ctx.fillStyle = '#efe4d2'; ctx.fillRect(px, py, pw, ph); ctx.strokeStyle = '#5a3a24'; ctx.lineWidth = 4; ctx.strokeRect(px, py, pw, ph);
    const cx = px + pw / 2; const top = py + ph * 0.2; const bot = py + ph * 0.92; const tw = pw * 0.17; const bw = pw * 0.12;

    if (finalMix.lemon) { ctx.fillStyle = '#f6d24a'; ctx.beginPath(); ctx.ellipse(cx + lv.half * 0.3, lv.y, 18, 6, 0, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = '#7a8a92'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - tw, top); ctx.lineTo(cx - bw, bot); ctx.lineTo(cx + bw, bot); ctx.lineTo(cx + tw, top); ctx.stroke();

// 場面つきで 1 回分を 作る

// ピッキング（物流センター）：左に 注文票、まん中に 段ボール箱、手前に 品物の 箱を ならべる。
//   ひろった 品物は 段ボール箱の 中に 入り、注文票に チェックが つく。
const PICK_BOX = { x: -0.25, z: 2.42, w: 0.66, h: 0.17, d: 0.46 }; // 店員は +z を 向くので、+x が 店員の 左
function startPicking(b, def) {
  const W = b.workArea; const slots = [];
  const slipDef = def.slip || { title: '注文票', color: '#2f7d6d' };
  const rowText = (k) => (k === 'お客さま' ? 'お客さまに わたす' : k);
  // 注文票（台の 左に 立てる）
  const slip = new Board(0.62, 0.84, 600);
  const paintSlip = () => slip.draw((ctx, w, h) => {
    ctx.fillStyle = '#fffef8'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = slipDef.color; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10);
    ctx.fillStyle = slipDef.color; ctx.font = '700 64px ' + FONT_DISPLAY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(slipDef.title, w / 2, h * 0.11);
    ctx.fillRect(w * 0.08, h * 0.19, w * 0.84, 4);
    const done = new Set(slots.filter((sl) => sl.done).map((sl) => sl.key));
    ctx.textAlign = 'left';
    def.need.forEach((k, i) => {
      const y = h * (0.3 + i * 0.15); const ok = done.has(k);
      ctx.strokeStyle = '#1f2a33'; ctx.lineWidth = 5; ctx.strokeRect(w * 0.1, y - 26, 52, 52);
      if (ok) { ctx.strokeStyle = '#2e9d57'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(w * 0.1 + 8, y); ctx.lineTo(w * 0.1 + 22, y + 16); ctx.lineTo(w * 0.1 + 48, y - 20); ctx.stroke(); }
      ctx.fillStyle = ok ? '#8a949c' : k === 'お客さま' ? slipDef.color : '#1f2a33';
      let px = 56; ctx.font = '700 ' + px + 'px ' + FONT_BODY; while (px > 28 && ctx.measureText(rowText(k)).width > w * 0.9 - 76) { px -= 4; ctx.font = '700 ' + px + 'px ' + FONT_BODY; }
      ctx.fillText(rowText(k), w * 0.1 + 76, y + 2);
    });
  });
  paintSlip();
  const stand = new THREE.Group(); stand.position.set(0.95, 0.9, 2.45); stand.rotation.y = Math.PI; W.add(stand);
  const tilt = new THREE.Group(); tilt.rotation.x = -0.2; stand.add(tilt);
  slip.mesh.position.set(0, 0.44, 0); tilt.add(slip.mesh);
  part(tilt, box(0.68, 0.9, 0.03), '#7a5a3a', 0, 0.44, -0.02); // 板
  part(tilt, box(0.2, 0.05, 0.05), '#b9bcb8', 0, 0.86, 0.02);  // クリップ
  // 段ボール箱（ふたが ひらいている）。山小屋は ふたの ない 持ち手つきの かご。箱ごと うごかせるよう ひとつの グループに（原点は W と 同じ）
  const crate = new THREE.Group(); W.add(crate);
  const { x: bx, z: bz, w: bw, d: bd } = PICK_BOX; const kraft = def.basket || '#c49a6c';
  const bh = def.basket ? 0.07 : PICK_BOX.h; // かごは 浅く（入れた 持ち物が 店員から 見える）
  part(crate, box(bw, 0.02, bd), kraft, bx, 0.91, bz);
  [-1, 1].forEach((sd) => { part(crate, box(bw, bh, 0.02), kraft, bx, 0.9 + bh / 2, bz + sd * bd / 2); part(crate, box(0.02, bh, bd), kraft, bx + sd * bw / 2, 0.9 + bh / 2, bz); });
  if (def.basket) [-1, 1].forEach((sd) => part(crate, box(0.03, 0.03, bd * 0.5), '#2f4f24', bx + sd * (bw / 2 - 0.02), 0.9 + bh + 0.015, bz)); // かごの 持ち手
  if (!def.basket) [-1, 1].forEach((sd) => {
    // 前後の ふた：奥は 立てて、店員がわ（-z）は 外に たらして 中が 見えるように
    const f = sd > 0 ? part(crate, box(bw, 0.015, bd * 0.48), '#d1a877', bx, 0.9 + bh + 0.08, bz + bd / 2 + 0.1) : part(crate, box(bw, bd * 0.48, 0.015), '#d1a877', bx, 0.9 + bh - bd * 0.24, bz - bd / 2 - 0.012);
    if (sd > 0) f.rotation.x = -0.9;
    const s2 = part(crate, box(bw * 0.4, 0.015, bd), '#d1a877', bx + sd * (bw / 2 + 0.07), 0.9 + bh + 0.06, bz); s2.rotation.z = sd * 0.9; // 左右の ふた
  });
  // 品物（手前に 1 列。ひとつずつ 名前の 書いた 箱に 入っている）
  const n = def.items.length; const span = 2.0;
  def.items.forEach((spec, idx) => {
    const x = -span / 2 + (idx + 0.5) * (span / n);
    const holder = new THREE.Group(); holder.position.set(x, 0.9, 2.02); holder.rotation.y = Math.PI; W.add(holder);
    const grp = new THREE.Group(); holder.add(grp);
    const bin = new THREE.Group(); grp.add(bin);
    const BW = Math.min(0.36, span / n - 0.06); const BH = 0.045; const BD = 0.26; // 箱は 浅く（中の 品物が 店員から 見える）
    part(bin, box(BW, 0.015, BD), '#d6b48a', 0, 0.008, 0);
    [-1, 1].forEach((sd) => { part(bin, box(BW, BH, 0.015), '#c49a6c', 0, BH / 2, sd * BD / 2); part(bin, box(0.015, BH, BD), '#c49a6c', sd * BW / 2, BH / 2, 0); });
    const plate = new Board(BW * 0.92, 0.1, 900);
    plate.draw((ctx, w, h) => { ctx.fillStyle = '#ffffff'; roundRect(ctx, 0, 0, w, h, 14); ctx.fill(); ctx.fillStyle = '#1f2a33'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let px = Math.round(h * 0.7); ctx.font = '700 ' + px + 'px ' + FONT_BODY; while (px > 20 && ctx.measureText(spec.label).width > w * 0.9) { px -= 4; ctx.font = '700 ' + px + 'px ' + FONT_BODY; } ctx.fillText(spec.label, w / 2, h * 0.54); });
    plate.mesh.position.set(0, 0.012, BD / 2 + 0.03); plate.mesh.rotation.x = -1.15; bin.add(plate.mesh); // 名札は 箱の 手前の 台に ねかせて 置く（品物を かくさない）。holder を 180° まわしているので +z が 手前
    const item = fitInto(spec.model ? spec.model() : makeItemMesh(spec), BW * 0.75, 0.2, BD * 0.75); item.position.y = 0.02; grp.add(item);
    grp.traverse((o) => { o.userData.slotIndex = idx; });
    const ringMesh = makeGlowRing(); ringMesh.scale.setScalar(BW / 0.26); ringMesh.position.y = 0.01; holder.add(ringMesh);
    slots.push({ spec, key: itemKey(spec), mesh: grp, item, ring: ringMesh, holder, done: false });
  });
  if (def.handTo) {
    // さいごに わたす お客さま（台の 向こうの 右より）。さわると かごごと お客さまの 手もとへ
    const spec = { label: 'お客さま', color: def.handTo }; const idx = slots.length;
    const holder = new THREE.Group(); holder.position.set(-0.75, 0.1, 3.45); holder.rotation.y = Math.PI - 0.3; W.add(holder);
    const grp = SM.guest(def.handTo); holder.add(grp); grp.traverse((o) => { o.userData.slotIndex = idx; });
    const ringMesh = makeGlowRing(); ringMesh.scale.setScalar(1.8); ringMesh.position.y = 0.01; holder.add(ringMesh);
    slots.push({ spec, key: 'お客さま', mesh: grp, ring: ringMesh, holder, done: false });
  }
  state.round = { def, slots, pos: 0, lastActionAt: performance.now(), hintShown: false, mistakeThisRound: false, paintSlip, inBox: 0, crate,
    ngText: (slot) => (slot.key === 'お客さま' ? 'さきに ' + slipDef.title + 'の ' + (slipDef.what || '持ち物') + 'を そろえよう' : def.handTo ? slipDef.title + 'を たしかめよう' : null) };
  state.feedback = { text: '', kind: '' };
  drawWorkBoard();
  renderHud();
  if (state.withSupport) speak(def.title + '。');
}

// ---- IT企業：台の 上の ノートパソコン。画面の 左に 伝票、右に 表。右の 行の □ か 数を えらぶ。
// データ入力（事務所）：台の 左に ノートパソコン（名簿の 表）、右に 紙の 名簿一覧、右手前に「完了」（スケッチの とおり）
function startDataEntry(b, def) {
  const W = b.workArea; const slots = [];
  b.counter.material.color.set('#e6e1d6');
  const idxOf = (id) => def.items.findIndex((it) => it.id === id);
  const addSlot = (id, mesh, holder, ring) => { const i = idxOf(id); mesh.userData.slotIndex = i; slots[i] = { spec: def.items[i], key: id, mesh, ring, holder, done: false }; };
  // ノートパソコン
  const lap = new THREE.Group(); lap.position.set(0.32, 0.9, 2.12); W.add(lap);
  part(lap, box(1.0, 0.03, 0.62), '#3d444b', 0, 0.015, 0); part(lap, box(0.86, 0.004, 0.3), '#2a2f34', 0, 0.032, 0.02); part(lap, box(0.3, 0.004, 0.16), '#4a525a', 0, 0.032, -0.22);
  const lid = new THREE.Group(); lid.position.set(0, 0.03, 0.3); lid.rotation.x = 0.22; lap.add(lid);
  const SW = 0.96; const SH = 0.62;
  part(lid, box(SW + 0.04, SH + 0.04, 0.02), '#3d444b', 0, SH / 2 + 0.02, 0.01);
  const disp = new THREE.Group(); disp.position.set(0, SH / 2 + 0.02, -0.002); disp.rotation.y = Math.PI; lid.add(disp);
  const screen = new Board(SW, SH, 1000); disp.add(screen.mesh);
  const CW = Math.round(SW * 1000); const CH = Math.round(SH * 1000);
  const COLS = [['番号', 100], ['名前', 240], ['ふりがな', 260], ['電話', 280]]; const TX = 40; const rowY = (i) => 160 + i * 72; // 行の 上の はし
  const entered = {}; def.people.forEach((pp, i) => { if (i === def.pre) entered[pp.no] = pp; });
  let flash = -1; let reading = -1;
  const paintScreen = () => screen.draw((c, w, h) => {
    c.fillStyle = '#dfe6ec'; c.fillRect(0, 0, w, h); c.fillStyle = '#ffffff'; c.fillRect(24, 24, w - 48, h - 150);
    c.fillStyle = '#1f2a33'; c.font = '700 46px ' + FONT_BODY; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('名簿', TX, 64);
    let x = TX; c.fillStyle = '#e8eef4'; c.fillRect(TX, 100, 880, 60);
    COLS.forEach(([t, cw]) => { c.fillStyle = '#33404a'; c.font = '700 34px ' + FONT_BODY; c.fillText(t, x + 14, 130); x += cw; });
    def.people.forEach((pp, i) => {
      const y = rowY(i); if (flash === pp.no) { c.fillStyle = 'rgba(208,69,58,0.2)'; c.fillRect(TX, y, 880, 72); }
      const e = entered[pp.no]; let cx = TX; c.font = '700 36px ' + FONT_BODY;
      [String(pp.no), e ? e.name : '', e ? e.kana : '', e ? e.tel : ''].forEach((t, k) => { c.fillStyle = k ? '#1f2a33' : '#55626d'; c.font = (k === 2 || k === 3 ? '400 28px ' : '700 36px ') + FONT_BODY; c.fillText(t, cx + 14, y + 36); cx += COLS[k][1]; });
    });
    c.strokeStyle = '#9aa4ab'; c.lineWidth = 3; // 表の 線
    for (let i = 0; i <= def.people.length; i++) { c.beginPath(); c.moveTo(TX, rowY(i)); c.lineTo(TX + 880, rowY(i)); c.stroke(); }
    let lx = TX; [0].concat(COLS.map((cc) => cc[1])).forEach((cw) => { lx += cw; c.beginPath(); c.moveTo(lx - (cw ? 0 : 0), 100); c.lineTo(lx, rowY(def.people.length)); c.stroke(); });
    c.beginPath(); c.moveTo(TX, 100); c.lineTo(TX, rowY(def.people.length)); c.stroke();
    c.fillStyle = '#5a5f9e'; roundRect(c, 16, h - 104, w - 32, 92, 20); c.fill();
    c.fillStyle = '#ffffff'; c.font = '700 48px ' + FONT_DISPLAY; c.textAlign = 'center';
    c.fillText(reading >= 0 ? '番号 ' + def.list[reading].no + ' の 行を えらぶ' : '名簿一覧を 上から 見て 入力', w / 2, h - 56);
  });
  paintScreen();
  const toLocal = (cx, cy) => [(cx / CW - 0.5) * SW, (0.5 - cy / CH) * SH];
  def.people.forEach((pp, i) => {
    const [lx, ly] = toLocal(TX + 440, rowY(i) + 36);
    const holder = new THREE.Group(); holder.position.set(lx, ly, 0.004); disp.add(holder);
    const hit = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 0.07), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.001, depthWrite: false })); holder.add(hit);
    const ringG = new THREE.Group(); ringG.scale.set(0.88 / 0.28, 0.09 / 0.28, 1); holder.add(ringG);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.14, 40), new THREE.MeshBasicMaterial({ color: '#ffd23f', transparent: true, opacity: 0.95, depthTest: false })); ring.renderOrder = 9; ring.visible = false; ringG.add(ring);
    addSlot('r' + pp.no, hit, holder, ring);
  });
  // 紙の 名簿一覧（台に 立てる。店員に 向けて ななめ）
  const PW = 0.58; const PH = 0.66; const paper = new Board(PW, PH, 900); const PCW = Math.round(PW * 900); const PCH = Math.round(PH * 900);
  const rowH = 150; const pTop = 110;
  const paintPaper = () => paper.draw((c, w, h) => {
    c.fillStyle = '#fffef8'; c.fillRect(0, 0, w, h); c.strokeStyle = '#5a5f9e'; c.lineWidth = 8; c.strokeRect(4, 4, w - 8, h - 8);
    c.fillStyle = '#1f2a33'; c.font = '700 50px ' + FONT_DISPLAY; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('名簿一覧', 28, 60);
    def.list.forEach((pp, k) => {
      const y = pTop + k * rowH; const done = slots[idxOf('p' + k)] && slots[idxOf('p' + k)].done && reading !== k;
      if (reading === k) { c.fillStyle = 'rgba(255,214,90,0.55)'; c.fillRect(14, y, w - 28, rowH - 8); }
      c.fillStyle = done ? '#9aa4ab' : '#5a5f9e'; c.font = '700 38px ' + FONT_BODY; c.fillText('番号 ' + pp.no, 28, y + 34);
      c.fillStyle = done ? '#9aa4ab' : '#1f2a33'; c.font = '700 38px ' + FONT_BODY; c.fillText(pp.name, 180, y + 34);
      c.font = '400 27px ' + FONT_BODY; c.fillText(pp.kana + '　' + pp.tel, 40, y + 92);
      c.strokeStyle = '#d5ddd3'; c.lineWidth = 3; c.beginPath(); c.moveTo(14, y + rowH - 4); c.lineTo(w - 14, y + rowH - 4); c.stroke();
      if (done) { c.strokeStyle = '#2e9d57'; c.lineWidth = 8; c.beginPath(); c.moveTo(w - 70, y + 50); c.lineTo(w - 54, y + 68); c.lineTo(w - 26, y + 26); c.stroke(); }
    });
  });
  const stand = new THREE.Group(); stand.position.set(-0.66, 0.9, 2.3); stand.rotation.y = Math.PI; W.add(stand);
  const tilt = new THREE.Group(); tilt.rotation.x = -0.22; stand.add(tilt);
  paper.mesh.position.set(0, PH / 2 + 0.02, 0.012); tilt.add(paper.mesh);
  part(tilt, box(PW + 0.06, PH + 0.06, 0.02), '#7a5a3a', 0, PH / 2 + 0.02, -0.004); part(tilt, box(0.16, 0.04, 0.04), '#b9bcb8', 0, PH + 0.04, 0.02);
  def.list.forEach((pp, k) => {
    const cy = pTop + k * rowH + (rowH - 8) / 2; const ly = (0.5 - cy / PCH) * PH;
    const holder = new THREE.Group(); holder.position.set(0, PH / 2 + 0.02 + ly, 0.016); tilt.add(holder);
    const hit = new THREE.Mesh(new THREE.PlaneGeometry(PW - 0.03, (rowH - 8) / 900), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.001, depthWrite: false })); holder.add(hit);
    const ringG = new THREE.Group(); ringG.scale.set((PW - 0.03) / 0.28, 0.17 / 0.28, 1); holder.add(ringG);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.14, 40), new THREE.MeshBasicMaterial({ color: '#ffd23f', transparent: true, opacity: 0.95, depthTest: false })); ring.renderOrder = 9; ring.visible = false; ringG.add(ring);
    addSlot('p' + k, hit, holder, ring);
  });
  paintPaper();
  // 完了 ボタン（名簿一覧の 手前）
  const dh = new THREE.Group(); dh.position.set(-0.66, 0.9, 1.92); W.add(dh);
  const dt = new THREE.Group(); dt.rotation.y = Math.PI; dh.add(dt);
  const btn = textPlate('完了', 0.26, 0.11, '#2f7d4f', '#ffffff'); btn.rotation.x = -1.0; btn.position.y = 0.05; dt.add(btn); part(dt, box(0.28, 0.04, 0.14), '#3d444b', 0, 0.02, 0);
  const dring = makeGlowRing(); dring.scale.setScalar(1.4); dring.position.y = 0.01; dh.add(dring);
  addSlot('done', btn, dh, dring);
  state.round = { def, slots, pos: 0, lastActionAt: performance.now(), hintShown: false, mistakeThisRound: false,
    onPick(slot, ok) {
      const id = slot.key;
      if (id.startsWith('r')) {
        if (!ok) { flash = Number(id.slice(1)); setTimeout(() => { flash = -1; paintScreen(); }, 450); paintScreen(); return; }
        const pp = def.list[reading]; entered[pp.no] = pp; reading = -1; paintScreen(); paintPaper(); return;
      }
      if (id.startsWith('p')) { if (!ok) return; reading = Number(id.slice(1)); paintPaper(); paintScreen(); return; }
      if (!ok) flashWrong(slot);
    } };
  moveRig(b.group.localToWorld(new THREE.Vector3(0, 0, STAFF_Z + 0.2)), b.yaw + Math.PI, 0.34, state.session.roundIndex ? 500 : undefined); // パソコンと 名簿一覧が 見える ように 少し 下を 向く
  state.feedback = { text: '', kind: '' };
  drawWorkBoard(); renderHud();
  if (state.withSupport) speak(def.title + '。最初は、' + stepLabel(def.need[0]) + '。');
}
// お守り作成（作業所）：台の 左に 完成品の トレー（奥へ ななめに ならべる・完成 ○こ）、まん中の 切りマットに つくりかけの お守り、
//   右に 部材、右奥に 手順書（写真と 説明）、奥の 左に「お守りづくり」の 札（スケッチの とおり）
//   配慮ありは 手順書が いまの 手順の 写真と 説明に なる。配慮なしは 完成見本の 写真だけ
const OMA_IMGS = {};
function omaImg(file, onload) {
  let im = OMA_IMGS[file];
  if (!im) { im = new Image(); im.src = 'omamori/' + file; OMA_IMGS[file] = im; }
  if (!(im.complete && im.naturalWidth) && onload) im.addEventListener('load', onload, { once: true });
  return im;
}
// 台に 平らに 置いた 字（上を 奥へ。rev は さかさ＝上が 手前）
function omaText(g, text, w, h, bg, fg, x, y, z, rev) {
  const t = textPlate(text, w, h, bg, fg); t.rotation.set(-Math.PI / 2, 0, rev ? 0 : Math.PI); t.position.set(x, y, z); g.add(t); return t;
}
const OMA_GOLD = { metalness: 0.55, roughness: 0.35 };
// ---- しめ飾り：手順が n こ おわった ときの 形を 部品の リストに する（3D の つくりかけ・トレーの できあがり・手順書の 絵で 共用）
//   座標は 切りマットの 上（x：店員から 見て 左が +、z：奥が +）。輪は 中心 (0, SHIME.c)・はんけい SHIME.r、しばる ところは 手前（下）
const SHIME = { r: 0.1, c: 0.03, straw: ['#d9b36a', '#cfa75a', '#e3c47e'], rope: ['#d2ab62', '#b98f48'], red: '#c8463d' };
const SHIME_KINDS = { nau: 0.32, wa: 0.45, kazari: 0.42 }; // 工程ごとの トレーに ならべる ときの 大きさ
const shimeRnd = (i) => { const v = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); }; // 毎回 同じ ばらつき
function shimeParts(kind, n) {
  const P = []; const { r: R, c: C } = SHIME;
  const rope = (trim, ends) => { // なった なわ（まっすぐ）：根もと・なわ・先
    P.push({ t: 'straws', a: [0.21, 0], b: [0.15, 0], count: 10, spread: 0.024 });
    P.push({ t: 'rope', pts: [[0.15, 0], [-0.15, 0]] });
    P.push({ t: 'straws', a: [-0.15, 0], b: [trim ? -0.19 : -0.235, 0], count: 10, spread: 0.028, jitter: trim ? 0 : 0.45 });
    P.push({ t: 'tie', at: [0.15, 0], dir: 'x' }); if (ends) P.push({ t: 'tie', at: [-0.15, 0], dir: 'x' });
  };
  const ring = (legs) => { // 輪（両はしを 手前で かさねる）と 下の 足
    const pts = []; for (let k = 0; k <= 40; k++) { const a = -0.45 + (k / 40) * (Math.PI * 2 + 0.9); pts.push([R * Math.sin(a), C - R * Math.cos(a)]); }
    if (legs < 2) [-1, 1].forEach((sd) => P.push({ t: 'straws', a: [sd * 0.03, C - R], b: [sd * 0.085, C - R - 0.11], count: 7, spread: 0.022, jitter: 0.35 })); // 足が ばらばら
    else P.push({ t: 'straws', a: [0, C - R], b: [0, C - R - (legs > 2 ? 0.075 : 0.11)], count: 14, spread: 0.045, jitter: legs > 2 ? 0 : 0.3 });
    P.push({ t: 'rope', pts });
  };

//   店員は +z を 向くので、+x が 店員の 左。札・箱の 文字は 店員がわ（-z）に 向ける。
// 倉庫の たなは 右の かべ（入口がわ。売り場の たなの 手前）に つける。たな・台車は wall の 中で 組み、wall ごと かべへ 向ける
//   wall：お店の 中の 位置と 向き（ローカルの -z が たなの 正面＝部屋の まん中）。stand：店員の 立つ ところ（かべの 方を 向く）
const STOCK = { x: 0.25, z: 2.55, w: 1.7, d: 0.45, boards: [1.1, 0.78, 0.46, 0.14], spotX: 0.58, cartX: -0.55, cartZ: 1.85, wall: { x: 0.625, z: 3.05, ry: -Math.PI / 2 }, stand: [0.5, 3.3] };
function stockBox(W, label, w, h, d, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); W.add(g);
  part(g, box(w, h, d), '#c49a6c', 0, h / 2, 0);
  part(g, box(w + 0.004, 0.02, d * 0.3), '#d9c08f', 0, h, 0); // ガムテープ
  const tag = new Board(w * 0.78, h * 0.42, 900);
  tag.draw((ctx, cw, ch) => { ctx.fillStyle = '#ffffff'; roundRect(ctx, 0, 0, cw, ch, 12); ctx.fill(); ctx.fillStyle = '#1f2a33'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let px = Math.round(ch * 0.72); ctx.font = '700 ' + px + 'px ' + FONT_BODY; while (px > 16 && ctx.measureText(label).width > cw * 0.9) { px -= 4; ctx.font = '700 ' + px + 'px ' + FONT_BODY; } ctx.fillText(label, cw / 2, ch * 0.54); });
  tag.mesh.position.set(0, h * 0.5, -d / 2 - 0.004); tag.mesh.rotation.y = Math.PI; g.add(tag.mesh);

}
function startStock(b, def) {
  const W = new THREE.Group(); W.position.set(STOCK.wall.x, 0, STOCK.wall.z); W.rotation.y = STOCK.wall.ry; b.workArea.add(W); const slots = [];
  if (b.guests) b.guests.forEach((p) => { p.visible = false; }); // 倉庫に お客さんは いない
  const { x: sx, z: sz, w: sw, d: sd } = STOCK;
  b.counter.visible = false; // 作業台の かわりに たなと 台車
  const metal = '#8f99a3';
  // たな（柱 4 本と 板 5 まい）
  [-1, 1].forEach((ex) => [-1, 1].forEach((ez) => part(W, box(0.04, 1.36, 0.04), metal, sx + ex * (sw / 2 - 0.02), 0.1 + 0.68, sz + ez * (sd / 2 - 0.02))));
  STOCK.boards.concat([1.42]).forEach((y) => part(W, box(sw, 0.03, sd), '#b9c1c8', sx, y, sz));
  // 箱の 大きさ（たなに ある 箱と 台車の 箱は 同じ）
  const BW = 0.3; const BH = 0.22; const BD = 0.32;
  const already = { A: 1, B: 2, C: 3, D: 1 }; // 絵の とおり：もとから ある 箱の 数
  def.items.forEach((spec, idx) => {
    const y = STOCK.boards[idx] + 0.015; const k = spec.label;
    const tier = new THREE.Group(); W.add(tier);
    // えらびやすい 当たり（だん ぜんたい）
    part(tier, box(sw - 0.06, 0.28, sd - 0.04), '#ffffff', sx, y + 0.14, sz, { transparent: true, opacity: 0.01 });
    // 札（左の はし）
    const plate = new Board(0.3, 0.12, 900);
    plate.draw((ctx, cw, ch) => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch); ctx.strokeStyle = '#1f2a33'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, cw - 8, ch - 8);
      ctx.fillStyle = '#1f2a33'; ctx.font = '700 ' + Math.round(ch * 0.72) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k, cw / 2, ch * 0.54); });
    plate.mesh.position.set(sx + sw / 2 - 0.2, y + 0.22, sz - sd / 2 - 0.006); plate.mesh.rotation.y = Math.PI; tier.add(plate.mesh);

  //   台車は 店員の 右ななめ前に あるので、店員の 立つ ところへの 向き（face：箱の 札が その 向きを 向く 角度）から 決める
  const { cartX: cx, cartZ: cz } = STOCK; const CW = 0.5; const CD = 0.62;
  const cart = new THREE.Group(); cart.position.set(cx, 0, cz); W.add(cart);
  W.updateMatrixWorld(true); const me = W.worldToLocal(b.group.localToWorld(new THREE.Vector3(STOCK.stand[0], 0, STOCK.stand[1])));
  const face = Math.atan2(-(me.x - cx), -(me.z - cz)); cart.rotation.y = face - Math.PI / 2; // 台車の +z（持ち手）→ 店員から 見て 右
  part(cart, box(CW, 0.04, CD), '#3d5a80', 0, 0.22, 0);
  [-1, 1].forEach((ex) => [-1, 1].forEach((ez) => part(cart, cyl(0.045, 0.045, 0.03, 14), '#2b2f33', ex * (CW / 2 - 0.06), 0.145, ez * (CD / 2 - 0.07)).rotation.z = Math.PI / 2));
  [-1, 1].forEach((ex) => part(cart, box(0.025, 0.85, 0.025), '#3d5a80', ex * (CW / 2 - 0.02), 0.65, CD / 2 - 0.02));
  part(cart, box(CW, 0.03, 0.03), '#3d5a80', 0, 1.07, CD / 2 - 0.02);
  // 箱も 台車に そろえて 横向き（札は 店員の 方）。持ち手から 少し はなして つむ。たなに 置く ときに たなの 正面向きへ もどす（shelveBox）

  moveRig(b.group.localToWorld(new THREE.Vector3(STOCK.stand[0], 0, STOCK.stand[1])), b.yaw + Math.PI / 2, 0.17, state.session.roundIndex ? 500 : undefined); // かべの たなの 方を 向く。下の だんと 台車が 見えるように 少し 下を 向く
  b.panel.position.set(-SHOP_W / 2 + 0.12, 0.28, 3.3); b.panel.rotation.y = Math.PI / 2; b.panelOut = true; // 指示モニターは たなの 上の かべに
  state.round = { def, slots, pos: 0, lastActionAt: performance.now(), hintShown: false, mistakeThisRound: false, stock: { cartBoxes, next: 0 } };
  state.feedback = { text: '', kind: '' };

  renderHud();

// 図書館（学校）：左に ミステリー、まん中に ファンタジーの 本だな、右に ブックトラック（店員から 見て 左が +x）。
//   本だなの 中は 店員がわ（-z）が 正面。だんの 左はしに 見出し板（あ・か・さ・た）、その あとに 作者の 頭文字の 順に 本が ならぶ。
// 本だなは 左右の かべぞい（x は 本だなの まん中、rot は 向き：左の かべは 部屋の まん中を 向く）
const LIBRARY = { cases: { 'ミステリー': { x: 1.98, rot: Math.PI / 2 }, 'ファンタジー': { x: -1.98, rot: -Math.PI / 2 } }, caseZ: 2.9, w: 1.3, d: 0.34, rowY: [1.33, 0.93, 0.53, 0.13], top: 1.75, cart: [0, 2.05], start: 0.4, standGap: 1.15 };

const libGapX = (j) => -0.42 + j * 0.2; // すきまの 位置（本だなの 中。店員から 見て 左→右が -x→ ではなく、本だなの ローカルで 左はしが 正）
function startLibrary(b, def) {

    L.rowY.concat([L.top - 0.02]).forEach((y) => part(c, box(L.w, 0.025, L.d), wood, 0, y - 0.0125, 0)); // 棚板

    const sign = new Board(0.16, 0.62, 900);
    sign.draw((ctx, w, h) => { ctx.fillStyle = col; roundRect(ctx, 0, 0, w, h, 20); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.font = '700 ' + Math.round(Math.min(w * 0.62, h / g.length * 0.85)) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; [...g].forEach((ch, n) => ctx.fillText(ch === 'ー' ? '｜' : ch, w / 2, h * (n + 0.5) / g.length)); });
    const sx = rot > 0 ? 1 : -1; // 札は 入口がわ（店員から 見える がわ）に つき出す
    sign.mesh.position.set(sx * (L.w / 2 + 0.1), L.top - 0.36, -L.d / 2); sign.mesh.rotation.y = Math.PI; c.add(sign.mesh);
    // だん：左はしに 見出し板、本は 作者の 頭文字の 順（本だなの ローカル +x が 店員から 見て 左）
    L.rowY.forEach((y, r) => {
      const plate = new Board(0.07, 0.22, 900);
      plate.draw((ctx, w, h) => { ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.strokeRect(4, 4, w - 8, h - 8); ctx.fillStyle = '#1f2a33'; ctx.font = '700 ' + Math.round(w * 0.75) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(LIB.rows[r][0], w / 2, h * 0.32); ctx.font = '700 ' + Math.round(w * 0.42) + 'px ' + FONT_BODY; ctx.fillText('行', w / 2, h * 0.68); });
      plate.mesh.position.set(-libGapX(0) + 0.1, y + 0.13, -L.d / 2 + 0.02); plate.mesh.rotation.y = Math.PI; c.add(plate.mesh); // 左はし（店員から 見て）
      def.shelf[g][r].forEach((kana, n) => {
        const bk = libBook(kana, col, LIB_BOOK_COLORS[(r * 3 + n + (g === 'ミステリー' ? 0 : 2)) % LIB_BOOK_COLORS.length]);

    const sl = addSlot(g, hitAll, c, new THREE.Vector3(cx + nx * (L.d / 2 + 0.3), 0.12, L.caseZ), 2.4);

  const [tx, tz] = L.cart; const truck = new THREE.Group(); truck.position.set(tx, 0.1, tz); W.add(truck);

  [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => part(truck, cyl(0.05, 0.05, 0.03, 14), '#2b2f36', sx * (TW / 2 - 0.08), 0.05, sz * (TD / 2 - 0.06)).rotation.z = Math.PI / 2));

  const caseTags = Object.keys(L.cases).map((g) => { const c = L.cases[g]; const t = labelSprite(g + 'の たなへ', { h: 0.1 }); t.position.set(c.x - Math.sin(c.rot) * (L.d / 2 + 0.05), L.top + 0.12, L.caseZ); W.add(t); return t; });
  // 手に 持つ ところ（立つ ところから 前へ 0.5、右へ 0.3）。fx, fz は 向いている 方向
  const hand = (sx, sz, fx, fz) => new THREE.Vector3(sx + fx * 0.5 - fz * 0.3, 0.98, sz + fz * 0.5 + fx * 0.3);
  const r = { def, slots, pos: 0, lastActionAt: performance.now(), hintShown: false, mistakeThisRound: false,
    onPick(slot, ok) {

// 台車の いちばん 上の 箱を、えらんだ たなの あいている ところへ
function shelveBox(st, slot) {
  const obj = st.cartBoxes[st.next++]; if (!obj) return;
  anims.push({ kind: 'box', obj, from: obj.position.clone(), to: slot.spot.clone(), ry0: obj.rotation.y, t0: performance.now() });
}

// ---- 清掃（客室）：モップかけ・台ふき。作業台は なく、部屋の 中の ものを えらぶ。
//   店員は +z を 向いて 立つので、+x が 店員の 左（画面の 左）。
function cleanSlot(ctx, idx, spec, obj, x, y, z, opt) {
  const o = opt || {};
  const holder = new THREE.Group(); holder.position.set(x, y, z); holder.rotation.y = Math.PI; ctx.W.add(holder);
  holder.add(obj); obj.traverse((m) => { m.userData.slotIndex = idx; });
  const ring = makeGlowRing(); ring.scale.setScalar(o.ring || 1); ring.position.y = o.ringY || 0.01; holder.add(ring);
  if (spec.label) { const sp = labelSprite(actionText(ctx.b.job, spec)); sp.position.y = o.labelY || 0.35; holder.add(sp); }
  ctx.slots[idx] = { spec, key: itemKey(spec), mesh: obj, ring, holder, done: false };
}
// よごれの 面（キャンバスに よごれを 描き、ふいた ところを 消す。0.12m の ます目で どれだけ きれいに なったかを 数える）
function dirtSurface(W, xc, zc, w, d, y, paint) {
  const RES = 160; const cw = Math.round(w * RES); const ch = Math.round(d * RES);
  const canvas = makeCanvas(cw, ch); const c = canvas.getContext('2d'); paint(c, cw, ch);
  const tex = new THREE.CanvasTexture(canvas);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));

// 動き
const anims = [];
// 動きの 決まって いない ものは、その 場で 持ち上げて 置きなおす（遠くへ 飛ばしたり 消したり しない）

  slot.ring.visible = false; slot.holder.children.forEach((c) => { if (c.isSprite) c.visible = false; });
  const h = slot.holder; const r0 = [h.rotation.x, h.rotation.y, h.rotation.z];

}
// キーフレームの 動き：keys = [{ d: ミリ秒, p: 位置, r: [x,y,z], s: 大きさ, lift: 弧の 高さ, osc: { p: [x,y,z], r: [x,y,z], n: 回数 }, at: 着いた ときに よぶ }]

}

  for (const sg of a.segs) {

    seg = sg; break;

  const sg = seg || a.segs[a.segs.length - 1]; const u = seg ? Math.max(0, (ms - sg.t0) / (sg.t1 - sg.t0)) : 1; const e = smooth(u);

// ひろった 品物を 段ボール箱の 中へ（箱に 入ったまま 見えている）
function dropIntoBox(slot, k) {
  const it = slot.item; const from = slot.holder.position.clone().add(new THREE.Vector3(0, it.position.y, 0));
  slot.holder.remove(it); slot.mesh.remove(it); (state.round.crate || state.booth.workArea).add(it); it.position.copy(from); it.rotation.y = Math.PI;
  it.traverse((o) => { delete o.userData.slotIndex; });

// そろった かごを 台の 向こうの お客さまの 手もとへ（かごの グループは 原点が W と 同じなので、うごかす ぶんだけ ずらす）
//   お客さまは (-0.75, 3.45) に 立ち、体の はんけいは 約 0.3。かご（おく行き 0.46）が 体に めりこまないよう、お客さまの 正面 0.56 の ところに 止める
function handOverCrate(r) {

// 手に 持った 品物を、えらんだ たなの すきまへ（弧を えがいて 入り、正面を 通路に 向ける）
function putOnShelf(r, slot) {
  const it = r.held; r.carryLabel.visible = false; slot.holder.children.forEach((c) => { if (c.isSprite) c.visible = false; });
  const size = new THREE.Box3().setFromObject(it).getSize(new THREE.Vector3());

function stepAnims(now) {

    if (a.kind === 'keys') {

    } else if (a.kind === 'hold') {

    } else if (a.kind === 'box') {

      a.obj.position.lerpVectors(a.from, a.to, e); a.obj.position.y += Math.sin(u * Math.PI) * 0.35;

      if (t < T[0]) { const u = t / T[0]; const e = u * u * (3 - 2 * u); o.position.lerpVectors(a.from, a.to, e); o.position.y += Math.sin(u * Math.PI) * 0.2; }

  if (state.where === 'furn') return (furnShop.btns || []).concat(furnShop.clickables); // 札の 下の ボタンも えらべる

function handleRay(ray) {

  if (!hits.length) return;
  const obj = hits[0].object;
  if (obj.userData.ibaAct) { obj.userData.ibaAct(); return; }
  if (obj.userData.ibaEnter) { openIba(); return; }
  if (obj.userData.kcEnter) { openKeiba(); return; }
  if (obj.userData.kcPad) { openKeiba(); kcPaddock(); return; }
  if (obj.userData.casinoEnter) { if (isleNow()) openCasino(casOutside()); else boardBoat('main'); return; } // カジノは あそびの島（ほかの 島からは 連絡船で）
  if (obj.userData.casEnter) { openCasino(); return; }
  if (obj.userData.furnBuy) { if (state.where === 'furn') { playSfx('coin'); buyFurn(obj.userData.furnBuy); } return; }
  if (obj.userData.furnCancel) { furnShop.selected = null; paintFurnTags(); renderHud(); return; }
  if (obj.userData.furnId) { if (state.where === 'furn') { playSfx(SFX_FURN[obj.userData.furnId] || 'pop'); pickFurn(obj.userData.furnId); } return; }

  else if (obj === b.btns.with) startSession(true);

  const v = old && nw && nw.t > old.t ? nw.p.clone().sub(old.p).multiplyScalar(1000 / (nw.t - old.t)) : new THREE.Vector3();

function rehabThrowBall(pl, v, hand) {

function stepRehabBall(pl, dt, now) {
  const B = pl.B; const H = REHAB.half - 0.25; const R = 0.07; const d = REHAB.dog; const D = d.userData; const bl = REHAB.ball;

// ---- 果物タッチ -----------------------------------------------------------
function rehabSpawnFruit(pl, now) {

  pl.streak = [kind, pl.streak[0] === kind ? pl.streak[1] + 1 : 1];
  const m = kind === 'apple' ? ITEM_MODELS['りんご']({ color: '#d0392b' }) : bananaMesh(); m.scale.setScalar(1.5);
  if (kind === 'apple') m.children.forEach((c) => { c.position.y -= 0.062; });
  const w = (o.wide ? 0.55 : 0.28) * (xr ? 1 : 0.9); // VR で ない ときは 画面の 上半分（左下の カードと 下の 帯に かくれない）
  const to = xr ? new THREE.Vector3((Math.random() * 2 - 1) * w, head.y - 0.3 + Math.random() * 0.4, head.z - 0.45)
    : new THREE.Vector3((Math.random() * 2 - 1) * w, head.y + 0.04 + Math.random() * 0.22, head.z - 0.85);
  const from = new THREE.Vector3(to.x * 3 + (Math.random() - 0.5) * 2, head.y + 0.4 + Math.random() * 0.8, head.z - 7);
  m.position.copy(from); REHAB.fx.add(m);
  pl.list.push({ m, kind, from, to, t0: now, dur: dur * 1000, wait: wait * 1000, state: 'fly', spin: (Math.random() - 0.5) * 6 });
}
function rehabTouch(pl, f, hand, now) {

  const want = fruitHand(f.kind, pl.opt); const name = f.kind === 'apple' ? 'りんご' : 'バナナ';
  if (hand === want) {
    f.state = 'pop'; f.t1 = now; pl.ok++; if (hand === 'right') pl.okR++; else pl.okL++;
    pl.rt.push(Math.max(0, now - (f.t0 + f.dur * 0.55))); playSfx('pick');
    const t = labelSprite('+1', { h: 0.08, bg: 'rgba(255,240,200,0.95)' }); t.position.copy(f.m.position).add(new THREE.Vector3(0, 0.12, 0)); REHAB.fx.add(t); setTimeout(() => REHAB.fx.remove(t), 700);
    rehabMsg(pl, 'いいね！ ' + HAND_NAME[hand] + 'で ' + name, 'ok');
  } else {
    f.state = 'bad'; f.t1 = now; pl.wrong++; playSfx('bump');

  }
}
function rehabPress(hand) { // VR で ない とき：手の 前に 来た 果物に その 手で さわる

  const now = performance.now();
  const ready = pl.list.filter((f) => (f.state === 'fly' || f.state === 'wait') && now - f.t0 > f.dur * 0.55).sort((a, b) => a.t0 - b.t0);

function stepRehabFruit(pl, dt, now) {
  const head = camera.position; const xr = rehabXR();

  Object.entries(REHAB.hands).forEach(([h, m]) => {
    m.visible = !xr; const rest = new THREE.Vector3(head.x + (h === 'right' ? 0.3 : -0.3), head.y - 0.26, head.z - 0.6);

}

// ---- 犬と バレー ----------------------------------------------------------
//   ひくい ネットを はさんで、コロが ビーチボールを とばして くる → 手で うちかえす → コロが 頭で かえす…の ラリー。
//   ボールは 風船バレーの ように ふわっと ゆっくり 落ちる（g を 小さく）。うつ 手は ボールなげと 同じ 指定（交互・右・左・どちらでも）
//   VR：コントローラーを 持った 手で ボールに ふれると うちかえす。VR で ない とき：ボールが 手の 前に 来たら ボタン（← 左手・→ 右手・スペース）
const VOLLEY = { dogZ: -5.2, netZ: -2.6, g: 3.6, r: 0.13 };
const VOLLEY_T = { slow: 2.8, normal: 2.2, fast: 1.6 }; // コロから 手もとまで 飛ぶ 時間（秒）
function beachBall() {
  const g = new THREE.Group(); const cols = ['#e0453a', '#ffffff', '#f2c230', '#ffffff', '#3c7fc4', '#ffffff'];
  cols.forEach((c, k) => part(g, new THREE.SphereGeometry(VOLLEY.r, 8, 12, (k / 6) * TAU, TAU / 6), c, 0, 0, 0, { roughness: 0.5 }));
  part(g, ball(VOLLEY.r * 0.22, 10, 8), '#ffffff', 0, VOLLEY.r * 0.92, 0).scale.y = 0.4;
  return g;
}
function buildVolley() { // 庭に ネットと ビーチボール（はじめて バレーを する とき）
  if (REHAB.net) return;
  const g = REHAB.g; const z = REHAB.stand.z + VOLLEY.netZ; const net = new THREE.Group(); g.add(net); REHAB.net = net;
  [-2.2, 2.2].forEach((x) => part(net, cyl(0.035, 0.035, 1.25, 8), '#8a8f96', x, 0.62, z));
  part(net, box(4.4, 0.45, 0.01), '#ffffff', 0, 1.0, z, { transparent: true, opacity: 0.45, side: THREE.DoubleSide });
  part(net, box(4.4, 0.04, 0.02), '#ffffff', 0, 1.23, z);
  for (let k = 0; k <= 22; k++) part(net, box(0.008, 0.45, 0.012), '#e8eef0', -2.2 + k * 0.2, 1.0, z); // あみの 目
  const vb = beachBall(); g.add(vb); REHAB.vball = vb;
}
const volleyLocal = (obj) => REHAB.g.worldToLocal(obj.getWorldPosition(new THREE.Vector3()));
function volleyToss(V, from, to, T) { // from から to へ T 秒で 落ちて くる 放物線
  V.from = from.clone(); V.to = to.clone(); V.T = T; V.t0 = performance.now();
  V.v = to.clone().sub(from).multiplyScalar(1 / T); V.v.y += 0.5 * VOLLEY.g * T;
}
function volleyServe(pl) {
  const V = pl.V; const o = pl.opt; const head = volleyLocal(camera); const xr = rehabXR();
  const w = (o.wide ? 0.5 : 0.25) * (xr ? 1 : 0.9);
  const to = xr ? new THREE.Vector3(head.x + (Math.random() * 2 - 1) * w, head.y - 0.15 + Math.random() * 0.35, head.z - 0.45)
    : new THREE.Vector3(head.x + (Math.random() * 2 - 1) * w, head.y + 0.05 + Math.random() * 0.2, head.z - 0.9);

function volleyHit(pl, hand) {

  const want = rehabWant(pl);
  if (HAND_NAME[want] && hand && hand !== want) { pl.wrongHand++; rehabMsg(pl, 'こんどは ' + HAND_NAME[want] + 'で うとう', 'ng'); playSfx('bump'); return; } // ちがう 手は うたない（まだ まに あう）
  pl.hits++; pl.rally++; pl.best = Math.max(pl.best, pl.rally); if (hand) pl.byHand[hand]++;
  playSfx('pop');
  const good = Math.abs(t - V.T) < 0.3;
  rehabMsg(pl, (good ? 'ナイス タイミング！ ' : 'うちかえした！ ') + pl.rally + ' 回 つづいて います', 'ok');
  // コロの 前へ（ネットを こえる 高い 山なり）。コロは 落ちる ところへ 横に 走る
  const dx = (Math.random() * 2 - 1) * 1.3; V.dogX = dx; V.state = 'go';

// ポーカー（テキサス ホールデム）：手札 2 まい＋場の 5 まいの うち 5 まいで いちばん 強い 役を つくる

const PK_SEATS = ['あなた', 'ケンタ', 'サキ'];

  if (!tween && now - chipCheckAt > 400) { chipCheckAt = now; if ((isleChipMode() ? 'isle' : 'main') !== chipMode) renderHud(); } // 島を 行き来 したら 下の チップを かえる（移動の とちゅうは まつ）
  stepPlay(dt, now);
  stepCover(dt, now);
  stepSlide(dt);
  if (state.round && state.round.tick && state.phase === 'work') state.round.tick(now);
  stepOpening(now);
  stepSeaFx(now); // 航跡の 泡・カモメ・ブイ
  updateSnow(dt, now);
  // 配慮あり：しばらく手が止まったら、つぎに選ぶものを光らせる（声かけ 1 回として数える）
  const r = state.round;
  if (r && state.phase === 'work' && state.withSupport && (!r.hintShown || (r.cover && !r.cover.mark.visible)) && (now - r.lastActionAt) / 1000 > AUTO_HINT_SEC) useHint(true);
  if (r && r.cover && r.cover.mark.visible) { const k = 1 + Math.sin(now / 180) * 0.15; r.cover.mark.scale.set(k, k, k); }
  if (r) r.slots.forEach((s) => { if (s.ring.visible) { const k = 1 + Math.sin(now / 180) * 0.12; s.ring.scale.set(k, k, k); } });
  if (!reduceMotion) windRotors.forEach((r) => { r.rotation.z = -(now / 1000) * 1.4 - r.userData.phase; });
  stepAnims(now);
  if (now - (drawMinimap.last || 0) > 100) { drawMinimap.last = now; drawMinimap(); } // 地図は 1 秒に 10 回で じゅうぶん
  kcRenderScreen(now); // 競馬場の 大型ビジョン
  renderer.render(scene, camera);
});

  state, goBooth, pickVariant, startSession, openRehab, startRehab, rehabPress, rehabSwipeThrow, rehabVolleyPress, REHAB, get rehabOpt() { return rehabOpt; }, set rehabOpt(v) { rehabOpt = v; }, select: onSelectItem, playSfx, sfxKind, SFX, nextTargetKey, setSeason, startWalk, exitToWalk, walkKeys, rig, look, walkable, booths, goHome, exitHome, goPlaza,
  get profile() { return profile; }, quitWork, openJobList, openCafeOrder, sitCafe, endPlay, CAFE_ORDER, doLeisure, LEISURE, home, HOME_LEVELS, upgradeHome, askUpgrade, homeLv, FURN, goFurniture, furnShop, pickFurn, exitFurniture, cheatCover() { const r = state.round; if (r && r.cover) { r.cover.surf.clearAll(); coverProgress(r, 1, performance.now()); } }, seasonal, LAKE, toWorld, nearbyActions, openShop, openBadgeBook, openSettings, openAreaPicker, openLookMaker, lookOf,
  // テスト用：オープニングを とばして 家を 用意する
  quickStart(homeKey, mode) { profile = { name: 'テスト', gender: 'n', mode: mode || 'money', home: homeKey || 'downtown', homeLv: 0, money: 0, badges: {}, owned: [], since: new Date().toISOString() }; saveProfile(); closeModal(); buildHome(); renderWallet(); goPlaza(); },
};

  document.fonts.ready.then(() => { if (state.where === 'booth') { if (state.phase === 'choose' || state.phase === 'pick') showChoose(); else if (state.phase === 'work') drawWorkBoard(); } });
}
}

// 看板の文字を正しいフォントで描くため、フォントが届いてから町を建てる（2 秒で見切る）。
(function boot() {
  const wait = document.fonts && document.fonts.load
    ? Promise.all(['700 40px "Zen Maru Gothic"', '400 40px "BIZ UDPGothic"', '700 40px "BIZ UDPGothic"'].map((f) => document.fonts.load(f, 'しごと')))
    : Promise.resolve();
  let started = false;
  const go = () => { if (!started) { started = true; main(); } };
  Promise.race([wait, new Promise((r) => setTimeout(r, 2000))]).then(go, go);
})();
