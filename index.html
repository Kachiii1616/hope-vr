<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOPE しごとタウン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 画面いっぱいの 3D の町。HTML は上の帯・下の職業チップ・左上の指示カード・右の記録だけを重ねる。 */
:root {
  --ink: #1f2a33;
  --ink-soft: #55626d;
  --paper: #f6f8f4;
  --card: rgba(255, 255, 255, 0.92);
  --line: #d5ddd3;
  --accent: #e0662f;      /* しごとタウンの目印（夕方の看板色） */
  --accent-ink: #ffffff;
  --ok: #2f7d4f;
  --ng: #b93a32;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eee9; --ink-soft: #a9b6b0; --paper: #141a1d; --card: rgba(24, 31, 35, 0.92);
    --line: #33413f; --accent: #f08a52; --accent-ink: #1b1209; --ok: #6cc28e; --ng: #ef7a70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eee9; --ink-soft: #a9b6b0; --paper: #141a1d; --card: rgba(24, 31, 35, 0.92);
  --line: #33413f; --accent: #f08a52; --accent-ink: #1b1209; --ok: #6cc28e; --ng: #ef7a70;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.hud { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }
.top {
  top: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-left: 8px; letter-spacing: 0; }
.place { font-size: 13px; color: var(--ink-soft); background: var(--card); border-radius: 999px; padding: 4px 12px; border: 1px solid var(--line); }
.spacer { flex: 1; }
button {
  font: inherit; font-weight: 700; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.instr {
  position: fixed; z-index: 2; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
  width: min(340px, calc(100% - 32px)); max-height: 42%; overflow: auto; box-sizing: border-box; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.12);
}
.instr h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 17px; text-wrap: balance; }
.instr .tag { display: inline-block; font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }
.instr ol { margin: 6px 0 0; padding-left: 1.4em; }
.instr li.done { color: var(--ink-soft); text-decoration: line-through; }
.instr li.now { font-weight: 700; color: var(--accent); }
.instr .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.instr .feedback { min-height: 1.4em; font-weight: 700; }
.instr .feedback.ok { color: var(--ok); }
.instr .feedback.ng { color: var(--ng); }
.instr .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.bottom {
  bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  scroll-padding-inline: 16px;
}
/* 帯そのものも 指を 受けないと 横に スクロールできない（.hud は 3D を さわれるよう pointer-events: none） */
.hud.bottom {
  pointer-events: auto; touch-action: pan-x; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  /* 右はしを うすくして「まだ 続く」と わかるように */
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
.hud.bottom::-webkit-scrollbar { display: none; }
/* スワイプが きかない 端末でも 送れるように、両はしに 送りボタン */
.chip-nav {
  position: fixed; z-index: 3; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 40px; height: 40px; padding: 0; border-radius: 50%;
  font-size: 22px; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
#chips-prev { left: 6px; }
#chips-next { right: 6px; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 700; }
.chip i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.chip span { font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.chip[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.log {
  position: fixed; z-index: 3; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: min(380px, calc(100% - 32px)); max-height: calc(100% - 160px); overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.log h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 17px; }
.log p.note { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); }
.log table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.log th, .log td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log th, .log td:not(:first-child) { white-space: nowrap; }
.log th { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
.log .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.log textarea { width: 100%; box-sizing: border-box; min-height: 120px; margin-top: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }

.pad {
  position: fixed; z-index: 3; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 68px);
  display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.pad[hidden] { display: none; }
.pad button { padding: 0; font-size: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.pad button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
/* オープニング・設定・買い物・バッジ帳（画面の まんなかの カード） */
.modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 25, 30, .38); }
.modal[hidden] { display: none; }
.modal-card {
  width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; box-sizing: border-box;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; box-shadow: 0 16px 48px rgba(0,0,0,.25);
}
.modal-card h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; text-wrap: balance; }
.modal-card p { margin: 4px 0 10px; color: var(--ink-soft); }
.modal-card label.field { display: block; font-weight: 700; margin: 14px 0 6px; }
.modal-card input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choices label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--card); cursor: pointer; }
.choices label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choices small { display: block; font-weight: 400; color: var(--ink-soft); }
.modal-card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.pick-list { display: grid; gap: 8px; margin-top: 8px; }
.pick-list button { text-align: left; padding: 10px 14px; }
.pick-list button small { display: block; font-weight: 400; color: var(--ink-soft); }
.pick-list button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.shop-grid .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.shop-grid .item b { font-size: 15px; }
.shop-grid .item span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.badge-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.badge-table td, .badge-table th { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
.medal { display: inline-block; min-width: 2.4em; text-align: center; border-radius: 999px; padding: 1px 8px; font-weight: 700; color: #1f2a33; }
.wallet { font-variant-numeric: tabular-nums; }

/* 右上の 島の 地図（いまの 場所と 向き・お店を タップで 移動） */
.minimap {
  position: fixed; z-index: 2; right: 12px; top: 64px; width: 210px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.minimap-bar { display: flex; gap: 4px; align-items: center; }
.minimap-size { border: 0; background: none; padding: 2px 6px 4px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.minimap.big { width: min(460px, calc(100vw - 24px)); }
.minimap.closed .minimap-size { display: none; }
.minimap-head { flex: 1; width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 2px 6px 4px; font-size: 12px; }
.minimap canvas { display: block; width: 100%; aspect-ratio: 850 / 680; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
.minimap.closed { width: auto; }
.minimap.closed canvas { display: none; }
@media (max-width: 560px) { .minimap { width: 150px; right: 8px; } }
.toast { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 999px; font-size: 13px; }

@media (max-width: 560px) {
  .brand small { display: none; }
  .instr { padding: 10px 12px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage" aria-label="しごとタウンの 3D 表示。ドラッグで見回し、タップでえらぶ"></div>

<header class="hud top">
  <div class="brand">HOPE しごとタウン<small>職業体験 VR 下書き</small></div>
  <div class="place" id="place">島ぜんたい</div>
  <div class="place wallet" id="wallet" hidden></div>
  <div class="spacer"></div>
  <button id="btn-home" type="button" hidden>いえ</button>
  <button id="btn-walk" type="button">島を歩く</button>
  <button id="btn-season" type="button">季節：夏</button>
  <button id="btn-log" type="button">きろく</button>
  <button id="btn-settings" type="button">設定</button>
  <button id="btn-vr" type="button" class="primary" hidden>VR で入る</button>
</header>

<section class="instr" id="instr" aria-live="polite"></section>

<aside class="log" id="log" hidden>
  <h2>体験のきろく</h2>
  <p class="note">hope-work の「② 作業体験」の場面（配慮なし／配慮あり）と同じ項目で残します。このブラウザの中だけに保存します。</p>
  <div style="overflow-x:auto"><table id="log-table"></table></div>
  <div class="actions">
    <button id="btn-copy" type="button">JSON をコピー</button>
    <button id="btn-clear" type="button">きろくを消す</button>
    <button id="btn-log-close" type="button">とじる</button>
  </div>
  <textarea id="log-json" readonly aria-label="記録の JSON" hidden></textarea>
</aside>

<nav class="hud bottom" id="chips" aria-label="職業をえらぶ"></nav>
<div class="minimap" id="minimap">
  <div class="minimap-bar"><button type="button" class="minimap-head" id="minimap-toggle" aria-expanded="true">島の 地図 <span aria-hidden="true">−</span></button><button type="button" class="minimap-size" id="minimap-size">大きく</button></div>
  <canvas id="minimap-canvas" role="img" aria-label="島ぜんたいの 地図。お店の 点を タップすると その お店へ 行きます"></canvas>
</div>
<button type="button" class="chip-nav" id="chips-prev" aria-label="前の お店へ 送る" hidden>‹</button>
<button type="button" class="chip-nav" id="chips-next" aria-label="つぎの お店へ 送る" hidden>›</button>
<div class="pad" id="pad" hidden aria-label="歩くボタン">
  <button type="button" class="up" data-key="fwd" aria-label="前へ">▲</button>
  <button type="button" class="left" data-key="left" aria-label="左を向く">◀</button>
  <button type="button" class="down" data-key="back" aria-label="うしろへ">▼</button>
  <button type="button" class="right" data-key="right" aria-label="右を向く">▶</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden><div class="modal-card" id="modal-card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function main() {
'use strict';

// ===========================================================================
// 職業の定義
//   1 回 = 1 個の完成。round() が「指示」「並べる道具」「正しく選ぶ順番」を返す。
//   ordered: true なら順番どおり、false なら順不同でぜんぶ選ぶ。
//   hope-work の作業マスタ（手順・不良基準）に合わせられるよう、手順は steps に持つ。
// ===========================================================================
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (arr, n) => shuffle(arr).slice(0, n);

const ROUNDS_PER_SESSION = 5;

const JOBS = [
  {
    id: 'logi', area: '漁港', name: '物流センター', work: 'ピッキング', color: '#2f7d6d', category: '実務',
    intro: '注文票を 見て、手前に ならんだ 品物を ひろい、段ボール箱に 入れます。',
    defect: 'ちがう しなものを ひろう',
    round() {
      const pool = [
        { label: 'りんご', shape: 'sphere', color: '#d0453a' }, { label: '牛乳', shape: 'box', color: '#f2f2ee' },
        { label: 'パン', shape: 'box', color: '#d9a35b' }, { label: 'お茶', shape: 'cyl', color: '#5d9a52' },
        { label: 'せっけん', shape: 'box', color: '#9ec7e6' }, { label: 'ティッシュ', shape: 'box', color: '#e9c8d8' },
      ];
      const n = 2 + Math.floor(Math.random() * 2);
      const need = sample(pool, n).map((p) => p.label);
      return { title: '注文票：' + need.join('・'), shortTitle: '注文の しなものを ひろう', items: shuffle(pool), need, ordered: false, layout: 'picking' };
    },
  },
  {
    id: 'store', area: '繁華街', name: 'コンビニ', work: '品出し', color: '#3b6fb6', category: '実務',
    intro: 'とどいた しなものを 持って 売り場を 歩き、正しい たなの 前で あいている すきまに 入れます。',
    defect: 'ちがう たなに 行く',
    round() {
      // たなは 店の 両がわの 壁に ある（decorateInterior の STORE_SHELVES）。たなを えらぶと その 前へ 行き、すきまに 入れる
      const shelves = STORE_SHELVES.map((u) => ({ label: u.label, color: u.color }));
      const shelf = pick(shelves).label;
      const item = pick(STORE_GOODS[shelf]);
      return { title: '「' + item + '」を たなに ならべる', shortTitle: '「' + item + '」を ならべる', items: shelves.concat({ label: 'すきま' }), need: [shelf, 'すきま'], ordered: true, carry: item, layout: 'wallShelf' };
    },
  },
  {
    id: 'clean', area: '首都', name: '清掃', work: 'モップかけ', color: '#4f8b9b', category: '実務',
    intro: '', defect: '', round() { return null; }, // 下の variants から えらんだ しごとが 入る（selectVariant）
    // 客室の 清掃。モップかけ・台ふきの 2 つから えらぶ（夏も 冬も。冬の モップは 雪どけ水）。
    variants: (() => {
      const mop = (winter) => ({
        work: winter ? '雪どけ水のモップかけ' : 'モップかけ', short: 'モップ', rounds: 2,
        intro: 'モップを 持って 部屋の ゆかを ぜんぶ ふきます。ベッドや たなに ぶつからないように、よけて 進みます。' + (winter ? 'ゆかには 雪どけ水が 落ちています。' : ''),
        defect: 'ものに ぶつかる',
        round() {
          return { title: 'モップで ゆかを ぜんぶ ふく（ものに ぶつからないように）', shortTitle: 'ゆかを ぜんぶ ふく', items: [], need: [], ordered: false, layout: 'mop', winter };
        },
      });
      const wipe = {
        work: '台ふき', short: '台ふき', rounds: 3,
        intro: '部屋の 台・机・テーブル・ローテーブルの うち、よごれている 家具の 前へ 行って、上を ぜんぶ ふきます。ふき残しが ないように。',
        defect: '（ふき残しが あると おわらない）',
        round() {
          return { title: '台ふきで 台の 上を ぜんぶ ふく', shortTitle: '台の 上を ぜんぶ ふく', items: [], need: [], ordered: false, layout: 'wipe' };
        },
      };
      return { summer: [mop(false), wipe], winter: [mop(true), wipe] };
    })(),
  },
  {
    id: 'cafe', area: '繁華街', name: 'カフェ', work: 'ドリンクづくり', color: '#8a5a3c', category: '実務',
    intro: 'うしろの 台で、手順書を 見ながら ドリンクを つくります。できたら ふりかえって、お客さまに わたします。',
    defect: '手順ちがい・ちがう 材料',
    round() { return cafeRound('summer'); },
  },
  {
    id: 'care', area: '住宅地', name: '介護施設', work: '配膳の手伝い', color: '#c4577a', category: '実務', rounds: 2,
    intro: '配膳車の おぜんを 上の だんから 順に とって、おぜんの 名札と 同じ 名前の 席へ 運びます。',
    defect: '順番・人の まちがい',
    round() { return careRound('summer'); },
  },
  {
    id: 'office', area: 'IT街', name: '事務所', work: '書類の仕分け', color: '#5a5f9e', category: '事務',
    intro: '書類の 種類を 見て、正しい トレーに 入れます。',
    defect: 'ちがう トレーに 入れる',
    round() {
      const trays = [
        { label: '請求書', shape: 'docTray', color: '#6f9be0' }, { label: '納品書', shape: 'docTray', color: '#7fc29b' },
        { label: '申込書', shape: 'docTray', color: '#f0b85a' }, { label: '見積書', shape: 'docTray', color: '#d98aa6' },
      ];
      const t = pick(trays).label;
      return { title: '「' + t + '」を トレーに 入れる', shortTitle: '書類を 仕分ける', items: trays, need: [t], ordered: false, carry: t };
    },

// レジ（コンビニの 冬）：かごの 品物（名前・重さ・ねだん）を 3 こ。スキャンは 好きな 順、袋は 重い ものから
const REGI_GOODS = [['鍋つゆ', 5, 380], ['お茶', 4, 150], ['みかん', 3, 300], ['電池', 2, 250], ['カイロ', 1, 100]];
function registerRound() {
  const goods = sample(REGI_GOODS, 3).sort((a, b) => b[1] - a[1]); // 重い 順
  const total = goods.reduce((sum, g) => sum + g[2], 0);
  const bill = pick([1000, 5000]);
  const scans = goods.map(([n]) => 'scan:' + n);
  const items = shuffle(goods).map(([n]) => ({ label: '', id: 'scan:' + n, good: n, name: n + 'を スキャン' }))
    .concat([1000, 5000, 10000].map((y) => ({ label: '', id: 'pay:' + y, yen: y, name: y + '円の キーを おす' })))
    .concat([{ label: '', id: '合計', name: '合計キーを おす' }, { label: '', id: 'おつり', name: 'おつりを わたす' }, { label: '', id: 'レジ袋', name: 'レジ袋を ひろげる' }])
    .concat(goods.map(([n]) => ({ label: '', id: 'bag:' + n, good: n, name: n + 'を 袋に 入れる' })))
    .concat([{ label: '', id: 'お客さま', name: 'お客さまに わたす' }]);
  return {
    title: 'レジ：' + goods.map((g) => g[0]).join('・') + '（袋は 重い ものから）', shortTitle: 'レジを 打って 袋に 入れる', items,
    need: scans.concat(['合計', 'pay:' + bill, 'おつり', 'レジ袋'], goods.map(([n]) => 'bag:' + n), ['お客さま']), free: scans, ordered: true,
    layout: 'register', goods, total, bill,
  };
}
// 袋づめ：重い ものから 順に（3 こ えらんで 重さの 順）
function bagRound(goods) {
  const chosen = sample(goods, 3).sort((a, b) => b[1] - a[1]).map((g) => g[0]);
  const items = [['レジ袋', 0]].concat(goods).map(([label]) => ({ label, color: '#ffffff' }));
  return { title: '袋づめ：' + chosen.join('・') + '（重い ものを 下に）', shortTitle: '重い ものから 袋に 入れる', items: shuffle(items), need: ['レジ袋'].concat(chosen), ordered: true, carryText: 'かご：' + chosen.join('・') };

function wrapLines(ctx, text, maxWidth) {

}

}
// w は 歩くときの ぶつかる大きさ（0 は 歩いて 通れる＝畑・校庭・入口の前など。省くと r と同じ）
function block(x, z, r, w) { blocked.push({ x, z, r, w: w === undefined ? r : w }); }
// 歩いて 行けるか（島の中・建物や 木に ぶつからない・川は 橋の 上だけ）
const WALKER_R = 0.3;
function walkable(x, z) {
  const m = WALKER_R / MAP_SCALE; const [px, py] = toMap(x, z);
  if (![[0, 0], [m, 0], [-m, 0], [0, m], [0, -m]].every(([ox, oy]) => insideIsland(px + ox, py + oy))) return false;
  if (blocked.some((b) => b.w > 0 && Math.hypot(b.x - x, b.z - z) < b.w + WALKER_R)) return false;
  const onRoad = roadSegs.some(([a, b]) => segDist(x, z, a, b) < ROAD_W / 2);
  return onRoad || !riverSegs.some(([a, b, w]) => segDist(x, z, a, b) < w / 2 + 0.1);
}

// 道ぞいに 建てる：near（地図 px）に いちばん 近い 道を さがし、正面を その 道に 向ける。
//   face が あれば 向きは その 方角に きめ、その 方向に ある 道まで 出す。
//   foot は 道の 中心線の 上の 点、front は 建物から 道への 向き。
function roadside(near, face) {
  const p = toWorld(...near); let foot = null; let front = null;
  if (face) {
    const yaw = FACE[face]; front = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)); let best = Infinity;
    const far = p.clone().addScaledVector(front, 200);
    roadSegs.forEach(([a, b]) => { const x = crossPoint(p, far, a, b); if (x && x.distanceTo(p) < best) { best = x.distanceTo(p); foot = x; } });
  } else {
    let best = Infinity; let seg = null;
    roadSegs.forEach(([a, b]) => { const d = segDist(p.x, p.z, a, b); if (d < best) { best = d; seg = [a, b]; } });
    const [a, b] = seg; const ab = b.clone().sub(a); const t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
    foot = a.clone().addScaledVector(ab, t);
    front = t > 0 && t < 1 ? new THREE.Vector3(-ab.z, 0, ab.x).normalize() : foot.clone().sub(p).normalize(); // 道の 端なら 端に 向く
    if (front.dot(foot.clone().sub(p)) < 0) front.negate();
  }
  return { foot, front, yaw: Math.atan2(front.x, front.z) };
}
// お店の 場所：pos は 奥の 壁（お店の 原点）、at は 地図に 点を 打つ ところ（お店の まん中）
Object.values(SITES).forEach((s) => {
  const r = roadside(s.near, s.face); s.yaw = r.yaw;
  s.pos = r.foot.clone().addScaledVector(r.front, -(s.set || SHOP_SET));
  s.at = toMap(s.pos.x + r.front.x * 0.9, s.pos.z + r.front.z * 0.9);
});

// 毎回同じ町になるよう、決まった順の乱数で散らす
let seed = 20260616;
const rand = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
function scatter(cx, cy, rx, ry, count, r, make, walkR) {
  let placed = 0;
  for (let tries = 0; tries < count * 40 && placed < count; tries++) {
    const a = rand() * Math.PI * 2; const d = Math.sqrt(rand());
    const p = toWorld(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d);
    if (!isFree(p.x, p.z, r)) continue;
    block(p.x, p.z, r, walkR); make(p.x, p.z, placed); placed++;
  }
}

// 平らな地面の色分け（地図の px の多角形）
function pxShape(points) {
  const s = new THREE.Shape();
  points.forEach(([x, y], i) => { const v = toWorld(x, y); if (i) s.lineTo(v.x, -v.z); else s.moveTo(v.x, -v.z); });
  return s;
}
function ellipse(cx, cy, rx, ry, n) { const out = []; for (let i = 0; i < (n || 28); i++) { const a = (i / (n || 28)) * Math.PI * 2; out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return out; }
function patch(points, color, y) {
  const m = new THREE.Mesh(new THREE.ShapeGeometry(pxShape(points)), cmat(color));
  m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m;
}
function addBox(x, y, z, w, h, d, color, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'string' ? cmat(color) : color);
  m.position.set(x, y, z); if (ry) m.rotation.y = ry; scene.add(m); return m;
}
function addCyl(x, y, z, rt, rb, h, color, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), cmat(color));
  m.position.set(x, y, z); scene.add(m); return m;
}

// 島の土台（上は草、横は砂浜の色）
(function buildIsland() {
  const geo = new THREE.ExtrudeGeometry(pxShape(ISLAND), { depth: 1.2, bevelEnabled: false, curveSegments: 1 });
  const island = new THREE.Mesh(geo, [cmat('#9cc47f'), cmat('#dcc893')]);
  island.rotation.x = -Math.PI / 2; island.position.y = -1.2; scene.add(island);
  // ビーチ（北西の海岸）
  patch(BEACH, '#ecdcae', 0.04);
  // 地域ごとの地面
  patch(ellipse(255, 455, 70, 52), '#d9d4c7', 0.05);       // 首都
  patch(ellipse(170, 600, 62, 72), '#cdc5b8', 0.05);       // 繁華街
  patch(ellipse(392, 262, 100, 80), '#7fa865', 0.05);      // 林業エリア
  patch(ellipse(372, 590, 52, 46), '#ddd3ad', 0.05);       // 学校エリア
  patch([[670, 310], [710, 335], [870, 340], [880, 350], [884, 400], [700, 410], [662, 340]], '#c9c8c0', 0.05); // 漁港の岸壁
  patch(ellipse(600, 240, 55, 38), '#d6cdb5', 0.05);       // 漁村
  // 湖
  patch(ellipse(265, 592, 46, 42), '#e3d9b5', 0.06);
  patch(ellipse(265, 592, 40, 36), '#5aa7d2', 0.07); // 湖（冬は 氷の スケート場。川と 分けた 色）
  // 田んぼ（農村：漁港から 南へ 行く 道と 川の あいだ。道に そろえて ななめに）。ang は 長い 辺の 向き、L・W は 半分の 長さ（px）
  [[752, 505, 40], [788, 560, 45]].forEach(([cx, cy, deg]) => {
    const a = deg * Math.PI / 180; const L = 30; const W = 18; const u = [Math.cos(a), Math.sin(a)]; const v = [-u[1], u[0]];
    const q = (s, t) => [cx + u[0] * s + v[0] * t, cy + u[1] * s + v[1] * t];
    patch([q(-L, -W), q(L, -W), q(L, W), q(-L, W)], '#8cc7a4', 0.065);
    [-L / 3, L / 3].forEach((s) => patch([q(s - 1, -W), q(s + 1, -W), q(s + 1, W), q(s - 1, W)], '#b08a5a', 0.068)); // あぜ
    patch([q(-L, -1), q(L, -1), q(L, 1), q(-L, 1)], '#b08a5a', 0.068);
    const c = toWorld(cx, cy); block(c.x, c.z, Math.hypot(L, W) * MAP_SCALE, 0);
    // 1 まいめの 田んぼで 苗植えを する（ローカルの +x が 長い 辺。植えた 苗は つぎの 体験まで のこる）
    if (!FIELDS.paddy) {

  // 湖：町の 家や 木は 5.8m よけるが、歩く ときは 季節で かわる（夏は 岸まで、冬は 氷の 上も 歩ける）
  LAKE.blk = (() => { const p = toWorld(...LAKE.at); return { x: p.x, z: p.z, r: 5.8, w: 3.6 }; })(); blocked.push(LAKE.blk);
  // 川（道より下に描き、交わるところは橋の欄干を立てる）
  riverSegs.forEach(([a, b, w], k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, a.distanceTo(b)), cmat('#5aa7d1'));
    m.rotation.x = -Math.PI / 2; m.rotation.z = Math.atan2(b.x - a.x, b.z - a.z);
    m.position.set((a.x + b.x) / 2, 0.075, (a.z + b.z) / 2); scene.add(m);
    [a, b].forEach((p) => { const j = new THREE.Mesh(new THREE.CircleGeometry(w / 2, 16), cmat('#5aa7d1')); j.rotation.x = -Math.PI / 2; j.position.set(p.x, 0.075, p.z); scene.add(j); });
    roadSegs.forEach(([c, d]) => {
      const x = crossPoint(a, b, c, d); if (!x) return;

        const rail = addBox(x.x + Math.cos(yaw) * side * (ROAD_W / 2 + 0.06), 0.3, x.z - Math.sin(yaw) * side * (ROAD_W / 2 + 0.06), 0.1, 0.42, w + 1.4, '#b5865a');
        rail.rotation.y = yaw;
      });
    });
  });
  // 道
  roadSegs.forEach(([a, b]) => {
    const len = a.distanceTo(b);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, len), cmat('#a9a49a'));
    m.rotation.x = -Math.PI / 2; m.rotation.z = Math.atan2(b.x - a.x, b.z - a.z);
    m.position.set((a.x + b.x) / 2, 0.09, (a.z + b.z) / 2); scene.add(m);
    const j = new THREE.Mesh(new THREE.CircleGeometry(ROAD_W / 2, 16), cmat('#a9a49a'));
    j.rotation.x = -Math.PI / 2; j.position.set(b.x, 0.09, b.z); scene.add(j);
  });
})();

function overviewSign(text, sub, color, w) {

  const paint = (sub) => b.draw((ctx, W, H) => {
    ctx.fillStyle = color || 'rgba(255,255,255,0.92)'; roundRect(ctx, 0, 0, W, H, H * 0.22); ctx.fill();
    ctx.fillStyle = color ? '#ffffff' : '#1f2a33'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fit = (weight, size, family, str, y) => { // はみ出す名前は 字を 小さく

// お店の 箱（床・横の壁・天井・入口の壁）。外から 見える 入口側の 部品を 返す（広場から えらぶ 当たり判定）。

function buildShopShell(g, job) {

  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); g.add(o); return o; };
  const floorColor = { rink: '#cfe3ee', yatai: '#d9c4a2', super: '#e9e6dc', school: '#b98f5a', fish: '#cfd8dc', forest: '#9c7a54', ski: '#d9dde3', logi: '#b9bcb8', store: '#e9e6dc', clean: '#d9cdb8', cafe: '#a87b55', care: '#d8c3a0', office: '#c9ccd3', farm: '#8f7a5a', craft: '#c4a27a', hut: '#9c7a54', wind: '#c9ccd3', it: '#c9ccd3', rice: '#8a7a52' }[job.id] || '#d9cdb8';
  const floor = add(new THREE.PlaneGeometry(SHOP_W, SHOP_DEPTH), mat(floorColor), 0, 0.1, SHOP_DEPTH / 2); floor.rotation.x = -Math.PI / 2;

  });
  add(new THREE.BoxGeometry(SHOP_W + 0.2, 0.08, SHOP_DEPTH + 0.1), mat('#fbfaf6'), 0, 3.0, SHOP_DEPTH / 2);
  // 天井の あかり
  [1.2, 3.0].forEach((z) => add(new THREE.CylinderGeometry(0.28, 0.28, 0.04, 24), mat('#fff8e0', { emissive: '#fff1c2', emissiveIntensity: 0.8 }), 0, 2.94, z));

// ===========================================================================
// 道具（作業で選ぶもの）の形
//   見ただけで「お茶」「パン」と わかるように、品物ごとに 部品を 組み立てる。
//   どの モデルも 底が y = 0。SHAPE_MODELS（形）→ ITEM_MODELS（品名）→ 基本の形 の順に さがす。
// ===========================================================================
const TAU = Math.PI * 2;
// 部品を 1 つ足す。x, y, z は部品の中心。
function part(g, geo, color, x, y, z, extra) {
  const m = new THREE.Mesh(geo, mat(color, extra)); m.position.set(x, y, z); g.add(m); return m;
}
const cyl = (rt, rb, h, seg) => new THREE.CylinderGeometry(rt, rb, h, seg || 20);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const ball = (r, ws, hs) => new THREE.SphereGeometry(r, ws || 18, hs || 12);
// 大きさを w × h × d に おさめる（たなに 小さく 並べるとき・手に 持つとき）
function fitInto(obj, w, h, d) {
  const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  const s = Math.min(w / size.x, h / size.y, (d || w) / size.z, 1);
  obj.scale.multiplyScalar(s);
  return obj;
}

// ペットボトル（お茶・水・ジュース）
function bottle(liquid, label, cap, clear) {
  const g = new THREE.Group();
  const glass = clear ? { transparent: true, opacity: 0.55, roughness: 0.15 } : { roughness: 0.3 };
  part(g, cyl(0.04, 0.04, 0.15), liquid, 0, 0.075, 0, glass);
  part(g, cyl(0.0415, 0.0415, 0.075), label, 0, 0.085, 0);
  part(g, cyl(0.0418, 0.0418, 0.012), '#ffffff', 0, 0.1, 0);
  part(g, cyl(0.017, 0.04, 0.04), liquid, 0, 0.17, 0, glass);
  part(g, cyl(0.016, 0.016, 0.014), '#e9eef0', 0, 0.197, 0, { transparent: true, opacity: 0.7 });
  part(g, cyl(0.019, 0.019, 0.024, 16), cap, 0, 0.214, 0);
  return g;
}

function makeItemMesh(spec) {
  const build = SHAPE_MODELS[spec.shape] || (spec.label && ITEM_MODELS[spec.label]);
  if (build) return build(spec);
  const m = mat(spec.color, spec.opacity ? { transparent: true, opacity: spec.opacity } : null);
  let geo; let y = 0;
  switch (spec.shape) {
    case 'sphere': geo = new THREE.SphereGeometry(0.075, 20, 14); y = 0.075; break;
    case 'cyl': geo = new THREE.CylinderGeometry(0.05, 0.05, 0.2, 18); y = 0.1; break;
    case 'cup': geo = new THREE.CylinderGeometry(0.055, 0.04, 0.13, 18); y = 0.065; break;
    case 'disc': geo = new THREE.CylinderGeometry(0.06, 0.06, 0.02, 18); y = 0.01; break;
    case 'stick': geo = new THREE.BoxGeometry(0.2, 0.025, 0.025); y = 0.02; break;
    case 'tray': geo = new THREE.BoxGeometry(0.3, 0.04, 0.22); y = 0.02; break;
    case 'plate': geo = new THREE.BoxGeometry(0.22, 0.12, 0.02); y = 0.06; break;
    case 'card': geo = new THREE.BoxGeometry(0.12, 0.005, 0.16); y = 0.005; break;
    case 'pouch': geo = new THREE.BoxGeometry(0.1, 0.14, 0.03); y = 0.07; break;
    case 'basket': geo = new THREE.CylinderGeometry(0.13, 0.1, 0.1, 18, 1, true); y = 0.05; m.side = THREE.DoubleSide; break;
    case 'person': geo = new THREE.CylinderGeometry(0.07, 0.07, 0.34, 14); y = 0.17; break;
    case 'blob': geo = new THREE.CircleGeometry(0.11, 18); break;
    case 'helmet': geo = new THREE.SphereGeometry(0.085, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2); break;
    case 'boot': geo = new THREE.BoxGeometry(0.09, 0.14, 0.18); y = 0.07; break;
    case 'ski': geo = new THREE.BoxGeometry(0.07, 0.02, 0.4); y = 0.01; break;
    case 'sheet': geo = new THREE.BoxGeometry(0.28, 0.012, 0.14); y = 0.006; break;
    default: geo = new THREE.BoxGeometry(0.12, 0.14, 0.1); y = 0.07;
  }
  const mesh = new THREE.Mesh(geo, m);
  if (spec.shape === 'blob') { mesh.rotation.x = -Math.PI / 2; mesh.scale.set(1 + Math.random() * 0.5, 1 + Math.random() * 0.3, 1); }
  mesh.position.y = y;
  return mesh;
}

function storeWallUnit(g, u) {
  const unit = new THREE.Group(); g.add(unit);
  const x = u.sd * DECO_X; const L = 1.18; const H = 1.62; const D = 0.4; const cold = u.label === '飲み物';
  part(unit, box(0.02, H, L), cold ? '#dceefa' : '#e9e6df', x + u.sd * 0.19, H / 2, u.z, cold ? { emissive: '#9fd0f0', emissiveIntensity: 0.35 } : null); // 背板（飲み物は 冷蔵ケースの あかり）

  part(unit, box(D, 0.03, L), '#d0d5db', x, H, u.z);
  STORE_ROWS.forEach((y, row) => {
    part(unit, box(D, 0.025, L), '#d0d5db', x, y, u.z);
    part(unit, box(0.012, 0.04, L), u.color, x - u.sd * D / 2, y - 0.005, u.z); // 値札の 帯

    }

  const sign = new Board(1.1, 0.22, 400);
  sign.draw((ctx, w, h) => { ctx.fillStyle = u.color; roundRect(ctx, 0, 0, w, h, 18); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.font = '700 ' + Math.round(h * 0.62) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(u.label, w / 2, h * 0.54); });

function moveRig(pos, yaw, pitch, dur) {
  const from = { p: rig.position.clone(), yaw: rig.rotation.y };
  const to = { p: pos.clone(), yaw };
  // 回転は近い向きへ
  let d = to.yaw - from.yaw; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; to.yaw = from.yaw + d;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function stepFurn(dt) {
  if (state.where !== 'furn' || tween) return;
  const { fwd, strafe } = moveInput(dt);
  if (!fwd && !strafe) return;
  camera.getWorldDirection(tmpDir); tmpDir.y = 0; if (tmpDir.lengthSq() < 1e-6) return; tmpDir.normalize();
  const speed = 1.6 * dt;
  const p = rig.position; const L = FURN.group.worldToLocal(p.clone());
  const d = new THREE.Vector3((tmpDir.x * fwd - tmpDir.z * strafe) * speed, 0, (tmpDir.z * fwd + tmpDir.x * strafe) * speed).applyQuaternion(FURN.group.quaternion.clone().invert()); // お店の 向きに なおす
  let nx = L.x + d.x; let nz = L.z + d.z;
  if (nz > FURN.W / 2 && Math.abs(nx) < 0.6) { exitFurniture(); return; }
  if (!furnFree(nx, nz)) { if (furnFree(nx, L.z)) nz = L.z; else if (furnFree(L.x, nz)) nx = L.x; else return; }
  const w = FURN.group.localToWorld(new THREE.Vector3(nx, 0, nz)); p.x = w.x; p.z = w.z;
}

// 品出し（コンビニ）：レジでは なく 売り場で。通路に 立って 品物の たなを えらぶと、その たなの 前へ 行く。
//   たなの 前で、あいている すきまを えらぶと 手に 持った 品物が 入る。
const AISLE = { z: 0.45, pitch: 0.1, shelfGap: 1.35, shelfPitch: 0.42 };

      const sp = labelSprite(actionText(b.job, spec)); sp.position.y = 0.42; holder.add(sp);

    }

    const ring = makeGlowRing(); ring.scale.setScalar(1.3); ring.position.y = 0.01; holder.add(ring); // ヒントは すきまを 光らせる
    const sp = labelSprite(actionText(b.job, spec)); sp.position.set(-u.sd * 0.25, 2.05 - gap.y, 0); holder.add(sp);

// レジ打ちと 袋づめ（コンビニの 冬）：店員から 見て 左から、かご → スキャナー → 画面 → スキャンした 品物 → レジ袋。
//   手前に キー（合計・お預かりの 金額）と おつりの 皿。お客さまは 台の 向こう。
const REGI = { y: 0.9, basket: [0.78, 2.3], scanner: [0.33, 2.15], screen: [0.42, 2.55], done: [-0.12, 2.3], bag: [-0.95, 2.2], keys: [0.4, 1.9], tray: [-0.55, 1.95], cash: [0.1, 2.6] };

    let px = Math.round(ch * 0.55); ctx.font = '700 ' + px + 'px ' + FONT_BODY; while (px > 14 && ctx.measureText(text).width > cw * 0.88) { px -= 2; ctx.font = '700 ' + px + 'px ' + FONT_BODY; } ctx.fillText(text, cw / 2, ch * 0.54); });
  return b.mesh;
}
function startRegister(b, def) {
  const W = b.workArea; const Y = REGI.y; const slots = []; const bySlot = {};

  const addSlot = (spec, holder, mesh, opt) => {

    let label = null; if (o.label) { label = labelSprite(o.label, { h: 0.08 }); label.position.y = o.labelY || 0.3; holder.add(label); }

  const sign = labelSprite('お客さまの かご', { h: 0.08, bg: 'rgba(220,235,250,0.95)' }); sign.position.set(0, 0.42, 0); basket.add(sign);
  // スキャナー・画面・キー・おつりの 皿
  const sc = new THREE.Group(); sc.position.copy(at(REGI.scanner)); W.add(sc);
  part(sc, box(0.24, 0.05, 0.2), '#2b2f36', 0, 0.025, 0); part(sc, box(0.16, 0.004, 0.12), '#ff4a3a', 0, 0.052, 0, { emissive: '#ff2a1a', emissiveIntensity: 0.7, transparent: true, opacity: 0.85 });
  const screen = new Board(0.4, 0.3, 900);
  const scr = { lines: [], total: false, paid: 0 };
  const paintScreen = () => screen.draw((c, w, h) => {

  // お客さま（台の 向こう）

  part(gm, ball(0.006, 8, 6), '#2b2b2b', -0.018, 0.31, 0.047); part(gm, ball(0.006, 8, 6), '#2b2b2b', 0.018, 0.31, 0.047);

  let inBag = 0;
  const key = { '合計': ['合計', '#e0662f'], 'pay:1000': ['1000円', '#3c7fc4'], 'pay:5000': ['5000円', '#3c7fc4'], 'pay:10000': ['10000円', '#3c7fc4'] };
  def.items.forEach((spec) => {
    const k = spec.id;

      holder.position.copy(basket.position).add(new THREE.Vector3(-0.13 + order * 0.13, 0.012, (order % 2) * 0.06 - 0.03)); holder.rotation.y = Math.PI; W.add(holder);

      const [t, col] = key[k]; const n = Object.keys(key).indexOf(k);
      const plate = textPlate(t, 0.13, 0.08, col, '#ffffff');
      const holder = tilted(plate, -1.0); holder.position.copy(at([REGI.keys[0] - n * 0.16, REGI.keys[1]], Y + 0.06)); W.add(holder);

// ピッキング（物流センター）：左に 注文票、まん中に 段ボール箱、手前に 品物の 箱を ならべる。
//   ひろった 品物は 段ボール箱の 中に 入り、注文票に チェックが つく。
const PICK_BOX = { x: -0.25, z: 2.42, w: 0.66, h: 0.17, d: 0.46 }; // 店員は +z を 向くので、+x が 店員の 左
function startPicking(b, def) {
  const W = b.workArea; const slots = [];
  // 注文票（台の 左に 立てる）
  const slip = new Board(0.62, 0.84, 600);
  const paintSlip = () => slip.draw((ctx, w, h) => {
    ctx.fillStyle = '#fffef8'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#2f7d6d'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10);
    ctx.fillStyle = '#2f7d6d'; ctx.font = '700 64px ' + FONT_DISPLAY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('注文票', w / 2, h * 0.11);
    ctx.fillRect(w * 0.08, h * 0.19, w * 0.84, 4);
    const done = new Set(slots.filter((sl) => sl.done).map((sl) => sl.key));
    ctx.textAlign = 'left';
    def.need.forEach((k, i) => {
      const y = h * (0.3 + i * 0.15); const ok = done.has(k);
      ctx.strokeStyle = '#1f2a33'; ctx.lineWidth = 5; ctx.strokeRect(w * 0.1, y - 26, 52, 52);
      if (ok) { ctx.strokeStyle = '#2e9d57'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(w * 0.1 + 8, y); ctx.lineTo(w * 0.1 + 22, y + 16); ctx.lineTo(w * 0.1 + 48, y - 20); ctx.stroke(); }
      ctx.fillStyle = ok ? '#8a949c' : '#1f2a33'; ctx.font = '700 56px ' + FONT_BODY; ctx.fillText(k, w * 0.1 + 76, y + 2);
    });
  });
  paintSlip();
  const stand = new THREE.Group(); stand.position.set(0.95, 0.9, 2.45); stand.rotation.y = Math.PI; W.add(stand);
  const tilt = new THREE.Group(); tilt.rotation.x = -0.2; stand.add(tilt);
  slip.mesh.position.set(0, 0.44, 0); tilt.add(slip.mesh);
  part(tilt, box(0.68, 0.9, 0.03), '#7a5a3a', 0, 0.44, -0.02); // 板
  part(tilt, box(0.2, 0.05, 0.05), '#b9bcb8', 0, 0.86, 0.02);  // クリップ
  // 段ボール箱（ふたが ひらいている）
  const { x: bx, z: bz, w: bw, h: bh, d: bd } = PICK_BOX; const kraft = '#c49a6c';
  part(W, box(bw, 0.02, bd), kraft, bx, 0.91, bz);
  [-1, 1].forEach((sd) => { part(W, box(bw, bh, 0.02), kraft, bx, 0.9 + bh / 2, bz + sd * bd / 2); part(W, box(0.02, bh, bd), kraft, bx + sd * bw / 2, 0.9 + bh / 2, bz); });
  [-1, 1].forEach((sd) => {
    // 前後の ふた：奥は 立てて、店員がわ（-z）は 外に たらして 中が 見えるように
    const f = sd > 0 ? part(W, box(bw, 0.015, bd * 0.48), '#d1a877', bx, 0.9 + bh + 0.08, bz + bd / 2 + 0.1) : part(W, box(bw, bd * 0.48, 0.015), '#d1a877', bx, 0.9 + bh - bd * 0.24, bz - bd / 2 - 0.012);
    if (sd > 0) f.rotation.x = -0.9;
    const s2 = part(W, box(bw * 0.4, 0.015, bd), '#d1a877', bx + sd * (bw / 2 + 0.07), 0.9 + bh + 0.06, bz); s2.rotation.z = sd * 0.9; // 左右の ふた
  });
  // 品物（手前に 1 列。ひとつずつ 名前の 書いた 箱に 入っている）
  const n = def.items.length; const span = 2.0;
  def.items.forEach((spec, idx) => {
    const x = -span / 2 + (idx + 0.5) * (span / n);
    const holder = new THREE.Group(); holder.position.set(x, 0.9, 1.98); holder.rotation.y = Math.PI; W.add(holder);
    const grp = new THREE.Group(); holder.add(grp);
    const bin = new THREE.Group(); grp.add(bin);
    const BW = Math.min(0.36, span / n - 0.06); const BH = 0.12; const BD = 0.3;
    part(bin, box(BW, 0.015, BD), '#d6b48a', 0, 0.008, 0);
    [-1, 1].forEach((sd) => { part(bin, box(BW, BH, 0.015), '#c49a6c', 0, BH / 2, sd * BD / 2); part(bin, box(0.015, BH, BD), '#c49a6c', sd * BW / 2, BH / 2, 0); });

      let px = Math.round(h * 0.7); ctx.font = '700 ' + px + 'px ' + FONT_BODY; while (px > 20 && ctx.measureText(spec.label).width > w * 0.9) { px -= 4; ctx.font = '700 ' + px + 'px ' + FONT_BODY; } ctx.fillText(spec.label, w / 2, h * 0.54); });
    plate.mesh.position.set(0, BH * 0.55, BD / 2 + 0.01); bin.add(plate.mesh); // 店員がわ（holder を 180° まわしているので +z が 手前）

  const lid = new THREE.Group(); lid.position.set(0, 0.03, 0.3); lid.rotation.x = 0.22; lap.add(lid); // うしろの ちょうつがい
  const SW = 0.96; const SH = 0.62;

  const disp = new THREE.Group(); disp.position.set(0, SH / 2 + 0.02, -0.002); disp.rotation.y = Math.PI; lid.add(disp); // 店員の ほうを 向く
  const screen = new Board(SW, SH, 1000); disp.add(screen.mesh);
  const CW = Math.round(SW * 1000); const CH = Math.round(SH * 1000);
  const month = (season === 'winter' ? 12 : 7) + '月分';
  const rowY = (i) => 196 + i * 82;
  const RX = CW / 2 + 20; // 右の 表の 左はし
  const marks = {}; // ✓ を つけた 行
  let flash = -1;
  const paint = () => screen.draw((c, w, h) => {
    c.fillStyle = '#dfe6ec'; c.fillRect(0, 0, w, h);
    [[24, '伝票'], [RX, def.rightTitle]].forEach(([x0, t]) => {
      c.fillStyle = '#ffffff'; c.fillRect(x0, 24, w / 2 - 44, h - 140);
      c.fillStyle = '#1f2a33'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '700 46px ' + FONT_BODY; c.fillText(t, x0 + (w / 2 - 44) / 2, 72);

    });
    c.textAlign = 'left'; c.font = '700 44px ' + FONT_BODY;
    def.rows.forEach((r, i) => {
      const y = rowY(i);
      c.fillStyle = '#1f2a33'; c.fillText(r.f, 70, y); c.fillText(r.n + 'こ', 330, y);
      if (flash === i) { c.fillStyle = 'rgba(208,69,58,0.18)'; c.fillRect(RX + 6, y - 40, w / 2 - 56, 80); }
      c.strokeStyle = '#55626d'; c.lineWidth = 5; c.strokeRect(RX + 24, y - 24, 48, 48); // ✓ を 入れる □
      c.fillStyle = '#1f2a33'; c.fillText(r.f, RX + 96, y); c.fillText(r.shown + 'こ', RX + 316, y);
      if (marks[i]) { c.strokeStyle = '#d0453a'; c.lineWidth = 9; c.beginPath(); c.moveTo(RX + 28, y - 2); c.lineTo(RX + 46, y + 20); c.lineTo(RX + 80, y - 34); c.stroke(); }
    });
    // 指示（大きく）

    const hit = new THREE.Mesh(new THREE.PlaneGeometry(w0 / 1000, 0.08), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.001, depthWrite: false }));
    hit.userData.slotIndex = idx; holder.add(hit);

  drawWorkBoard();
  renderHud();
  if (state.withSupport) speak(def.title + '。');
}

// 倉庫整理（スーパー）：左に 4 だんの たな（上から A・B・C・D の 札）、右に 箱を つんだ 台車。
//   台車の 箱は 上から 順に おろして、同じ 記号の たなの あいている ところへ 置く。たなを えらぶと 箱が 動く。
//   店員は +z を 向くので、+x が 店員の 左。札・箱の 文字は 店員がわ（-z）に 向ける。
const STOCK = { x: 0.25, z: 2.55, w: 1.7, d: 0.45, boards: [1.1, 0.78, 0.46, 0.14], spotX: 0.58, cartX: -1.35, cartZ: 2.3 };
function stockBox(W, label, w, h, d, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); W.add(g);
  part(g, box(w, h, d), '#c49a6c', 0, h / 2, 0);
  part(g, box(w + 0.004, 0.02, d * 0.3), '#d9c08f', 0, h, 0); // ガムテープ
  const tag = new Board(w * 0.78, h * 0.42, 900);
  tag.draw((ctx, cw, ch) => { ctx.fillStyle = '#ffffff'; roundRect(ctx, 0, 0, cw, ch, 12); ctx.fill(); ctx.fillStyle = '#1f2a33'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let px = Math.round(ch * 0.72); ctx.font = '700 ' + px + 'px ' + FONT_BODY; while (px > 16 && ctx.measureText(label).width > cw * 0.9) { px -= 4; ctx.font = '700 ' + px + 'px ' + FONT_BODY; } ctx.fillText(label, cw / 2, ch * 0.54); });
  tag.mesh.position.set(0, h * 0.5, -d / 2 - 0.004); tag.mesh.rotation.y = Math.PI; g.add(tag.mesh);
  return g;
}
function startStock(b, def) {
  const W = b.workArea; const slots = []; const { x: sx, z: sz, w: sw, d: sd } = STOCK;
  b.counter.visible = false; // 作業台の かわりに たなと 台車
  const metal = '#8f99a3';
  // たな（柱 4 本と 板 5 まい）
  [-1, 1].forEach((ex) => [-1, 1].forEach((ez) => part(W, box(0.04, 1.36, 0.04), metal, sx + ex * (sw / 2 - 0.02), 0.1 + 0.68, sz + ez * (sd / 2 - 0.02))));
  STOCK.boards.concat([1.42]).forEach((y) => part(W, box(sw, 0.03, sd), '#b9c1c8', sx, y, sz));
  // 箱の 大きさ（たなに ある 箱と 台車の 箱は 同じ）

    const plate = new Board(0.3, 0.12, 900);
    plate.draw((ctx, cw, ch) => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch); ctx.strokeStyle = '#1f2a33'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, cw - 8, ch - 8);
      ctx.fillStyle = '#1f2a33'; ctx.font = '700 ' + Math.round(ch * 0.72) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k, cw / 2, ch * 0.54); });
    plate.mesh.position.set(sx + sw / 2 - 0.2, y + 0.22, sz - sd / 2 - 0.006); plate.mesh.rotation.y = Math.PI; tier.add(plate.mesh);

    const ring = makeGlowRing(); ring.scale.setScalar(1.5); ring.position.set(STOCK.spotX, y + 0.01, sz); W.add(ring);

  // 台車（車輪・持ち手）と、上から 順に つんだ 箱
  const { cartX: cx, cartZ: cz } = STOCK; const CW = 0.5; const CD = 0.62;
  part(W, box(CW, 0.04, CD), '#3d5a80', cx, 0.22, cz);
  [-1, 1].forEach((ex) => [-1, 1].forEach((ez) => part(W, cyl(0.045, 0.045, 0.03, 14), '#2b2f33', cx + ex * (CW / 2 - 0.06), 0.145, cz + ez * (CD / 2 - 0.07)).rotation.z = Math.PI / 2));
  [-1, 1].forEach((ex) => part(W, box(0.025, 0.85, 0.025), '#3d5a80', cx + ex * (CW / 2 - 0.02), 0.65, cz + CD / 2 - 0.02));
  part(W, box(CW, 0.03, 0.03), '#3d5a80', cx, 1.07, cz + CD / 2 - 0.02);
  const cartBoxes = def.need.map((k, n) => stockBox(W, '商品' + k, BW, BH, BD, cx, 0.24 + (def.need.length - 1 - n) * (BH + 0.005), cz - 0.06));
  look.pitch = 0.2; // たなの 下の だんと 台車が 見えるように 少し 下を 向く
  state.round = { def, slots, pos: 0, lastActionAt: performance.now(), hintShown: false, mistakeThisRound: false, stock: { cartBoxes, next: 0 } };
  state.feedback = { text: '', kind: '' };

// 図書館（学校）：左に ミステリー、まん中に ファンタジーの 本だな、右に ブックトラック（店員から 見て 左が +x）。
//   本だなの 中は 店員がわ（-z）が 正面。だんの 左はしに 見出し板（あ・か・さ・た）、その あとに 作者の 頭文字の 順に 本が ならぶ。
// 本だなは 左右の かべぞい（x は 本だなの まん中、rot は 向き：左の かべは 部屋の まん中を 向く）
const LIBRARY = { cases: { 'ミステリー': { x: 1.98, rot: Math.PI / 2 }, 'ファンタジー': { x: -1.98, rot: -Math.PI / 2 } }, caseZ: 2.9, w: 1.3, d: 0.34, rowY: [1.33, 0.93, 0.53, 0.13], top: 1.75, cart: [0, 2.05], start: 0.4, standGap: 1.15 };

// 本（背を 店員がわに 向ける）。背の 下に ラベル（頭文字）、その 上に ジャンルの 色の テープ
function libBook(kana, genreColor, color) {
  const g = new THREE.Group(); const BW = 0.07; const BH = 0.3; const BD = 0.22;
  part(g, box(BW, BH, BD), color, 0, BH / 2, 0);
  part(g, box(BW + 0.002, 0.02, 0.004), genreColor, 0, 0.12, -BD / 2 - 0.002);
  const lab = new Board(0.06, 0.06, 1400);
  lab.draw((c, w, h) => { c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h); c.strokeStyle = genreColor; c.lineWidth = 6; c.strokeRect(3, 3, w - 6, h - 6); c.fillStyle = '#1f2a33'; c.font = '700 ' + Math.round(h * 0.7) + 'px ' + FONT_BODY; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(kana, w / 2, h * 0.55); });
  lab.mesh.position.set(0, 0.06, -BD / 2 - 0.004); lab.mesh.rotation.y = Math.PI; g.add(lab.mesh);

}
const libGapX = (j) => -0.42 + j * 0.2; // すきまの 位置（本だなの 中。店員から 見て 左→右が -x→ ではなく、本だなの ローカルで 左はしが 正）
function startLibrary(b, def) {
  const W = b.workArea; const slots = []; const L = LIBRARY;

  b.panel.position.y = 0.3; b.panelOut = true; // 指示モニターを 本だなより 上へ
  const toW = (x, z) => b.group.localToWorld(new THREE.Vector3(x, 0, z));
  const idx = (id) => def.items.findIndex((it) => it.id === id);

    const ring = makeGlowRing(); ring.scale.setScalar(ringScale || 1); ring.position.copy(ringAt); W.add(ring);
    const sl = { spec: def.items[i], key: itemKey(def.items[i]), mesh, ring, holder, done: false }; slots[i] = sl; return sl;
  };

    const nx = -Math.sin(rot); // 正面の 向き（部屋がわ）の x
    const wood = '#9a6b44';
    part(c, box(L.w, L.top, 0.02), wood, 0, L.top / 2, L.d / 2);                                    // 背板
    [-1, 1].forEach((sd) => part(c, box(0.03, L.top, L.d), wood, sd * (L.w / 2 - 0.015), L.top / 2, 0)); // 側板
    L.rowY.concat([L.top - 0.02]).forEach((y) => part(c, box(L.w, 0.025, L.d), wood, 0, y - 0.0125, 0)); // 棚板
    // ジャンルの 札（店員から 見て 左がわの 上に つき出す。スケッチの とおり）
    const sign = new Board(0.16, 0.62, 900);
    sign.draw((ctx, w, h) => { ctx.fillStyle = col; roundRect(ctx, 0, 0, w, h, 20); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.font = '700 ' + Math.round(Math.min(w * 0.62, h / g.length * 0.85)) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; [...g].forEach((ch, n) => ctx.fillText(ch === 'ー' ? '｜' : ch, w / 2, h * (n + 0.5) / g.length)); });
    const sx = rot > 0 ? 1 : -1; // 札は 入口がわ（店員から 見える がわ）に つき出す
    sign.mesh.position.set(sx * (L.w / 2 + 0.1), L.top - 0.36, -L.d / 2); sign.mesh.rotation.y = Math.PI; c.add(sign.mesh);
    // だん：左はしに 見出し板、本は 作者の 頭文字の 順（本だなの ローカル +x が 店員から 見て 左）
    L.rowY.forEach((y, r) => {
      const plate = new Board(0.07, 0.22, 900);
      plate.draw((ctx, w, h) => { ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.strokeRect(4, 4, w - 8, h - 8); ctx.fillStyle = '#1f2a33'; ctx.font = '700 ' + Math.round(w * 0.75) + 'px ' + FONT_BODY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(LIB.rows[r][0], w / 2, h * 0.32); ctx.font = '700 ' + Math.round(w * 0.42) + 'px ' + FONT_BODY; ctx.fillText('行', w / 2, h * 0.68); });
      plate.mesh.position.set(-libGapX(0) + 0.1, y + 0.13, -L.d / 2 + 0.02); plate.mesh.rotation.y = Math.PI; c.add(plate.mesh); // 左はし（店員から 見て）
      def.shelf[g][r].forEach((kana, n) => {
        const bk = libBook(kana, col, LIB_BOOK_COLORS[(r * 3 + n + (g === 'ミステリー' ? 0 : 2)) % LIB_BOOK_COLORS.length]);
        bk.position.set(-(libGapX(n) + 0.1), y, 0.02); c.add(bk);
      });
      if (g === def.genre) for (let j = 0; j < 5; j++) {
        // すきま（えらべる ところ）。本だなを えらぶまで かくす
        const holder = new THREE.Group(); holder.position.set(-libGapX(j), y, 0); holder.visible = false; c.add(holder);
        const hit = new THREE.Group(); holder.add(hit);
        part(hit, box(0.08, 0.3, L.d - 0.04), '#ffe27a', 0, 0.15, 0, { transparent: true, opacity: 0.28, depthWrite: false });
        const sl = addSlot('gap' + r + '_' + j, hit, holder, new THREE.Vector3(0, 0, 0), 0.7);
        W.remove(sl.ring); sl.ring.position.set(0, 0.01, -0.05); holder.add(sl.ring);
        gaps[r + '_' + j] = holder;
      }
    });
    // 本だなを えらぶ 当たり（本だな ぜんたい）
    const hitAll = new THREE.Group(); c.add(hitAll);
    part(hitAll, box(L.w, L.top, L.d), '#ffffff', 0, L.top / 2, 0, { transparent: true, opacity: 0.01, depthWrite: false });
    const sl = addSlot(g, hitAll, c, new THREE.Vector3(cx + nx * (L.d / 2 + 0.3), 0.12, L.caseZ), 2.4);
    sl.case = c; sl.cx = cx; sl.nx = nx; sl.rot = rot;
  });
  // ブックトラック（2 だん。本が たって ならぶ。車輪と 持ち手）
  const [tx, tz] = L.cart; const truck = new THREE.Group(); truck.position.set(tx, 0.1, tz); W.add(truck);
  const TW = 0.7; const TD = 0.42; const steel = '#8a8f96';
  [0.18, 0.62].forEach((y) => { part(truck, box(TW, 0.03, TD), '#b98a5a', 0, y, 0); part(truck, box(0.012, 0.012, TD), steel, 0, y + 0.012, 0); });
  [-1, 1].forEach((sx) => { part(truck, box(0.03, 0.9, TD), '#b98a5a', sx * (TW / 2 - 0.015), 0.5, 0); });
  [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => part(truck, cyl(0.05, 0.05, 0.03, 14), '#2b2f36', sx * (TW / 2 - 0.08), 0.05, sz * (TD / 2 - 0.06)).rotation.z = Math.PI / 2));
  part(truck, cyl(0.014, 0.014, 0.75, 8), steel, -TW / 2 - 0.06, 0.95, 0).rotation.x = Math.PI / 2; // 持ち手（かべがわ）

  const caseTags = Object.keys(L.cases).map((g) => { const c = L.cases[g]; const t = labelSprite(g + 'の たなへ', { h: 0.1 }); t.position.set(c.x - Math.sin(c.rot) * (L.d / 2 + 0.05), L.top + 0.12, L.caseZ); W.add(t); return t; });
  // 手に 持つ ところ（立つ ところから 前へ 0.5、右へ 0.3）。fx, fz は 向いている 方向
  const hand = (sx, sz, fx, fz) => new THREE.Vector3(sx + fx * 0.5 - fz * 0.3, 0.98, sz + fz * 0.5 + fx * 0.3);
  const r = { def, slots, pos: 0, lastActionAt: performance.now(), hintShown: false, mistakeThisRound: false,
    onPick(slot, ok) {
      if (!ok) { flashWrong(slot); return; }
      const now = performance.now(); const id = slot.spec.id;
      if (id === 'cart') {
        bookTag.visible = false; book.rotation.z = 0; book.scale.setScalar(0.75); // 手に 持つ ときは 小さく 見える
        anims.push({ kind: 'box', obj: book, from: book.position.clone(), to: hand(0, L.start, 0, 1), t0: now }); // 手に 持つ
      } else if (LIB.genres[id]) {
        // 本だなの 前へ 行き、すきまを 出す
        caseTags.forEach((t) => { t.visible = false; });
        // 本だなの 前に 立って、かべの 本だなを 向く（左の かべなら 左を 向く）

        Object.values(gaps).forEach((h) => { h.visible = false; });

  state.round = r;
  moveRig(toW(0, L.start), b.yaw + Math.PI, 0.18, state.session.roundIndex ? 800 : undefined); // 本だなと ブックトラックが 見える ところ

// 台車の いちばん 上の 箱を、えらんだ たなの あいている ところへ
function shelveBox(st, slot) {
  const obj = st.cartBoxes[st.next++]; if (!obj) return;
  anims.push({ kind: 'box', obj, from: obj.position.clone(), to: slot.spot.clone(), t0: performance.now() });
}

// ---- 清掃（客室）：モップかけ・台ふき。作業台は なく、部屋の 中の ものを えらぶ。
//   店員は +z を 向いて 立つので、+x が 店員の 左（画面の 左）。
function cleanSlot(ctx, idx, spec, obj, x, y, z, opt) {
  const o = opt || {};
  const holder = new THREE.Group(); holder.position.set(x, y, z); holder.rotation.y = Math.PI; ctx.W.add(holder);
  holder.add(obj); obj.traverse((m) => { m.userData.slotIndex = idx; });
  const ring = makeGlowRing(); ring.scale.setScalar(o.ring || 1); ring.position.y = o.ringY || 0.01; holder.add(ring);
  if (spec.label) { const sp = labelSprite(actionText(ctx.b.job, spec)); sp.position.y = o.labelY || 0.35; holder.add(sp); }

function remainingKeys() {

function onSelectItem(slotIndex) {

    const i = r.def.need.indexOf(slot.key, r.pos);

  }

    state.feedback = { text: ngText, kind: 'ng' };

}

function fmtDuration(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return (m ? m + '分' : '') + s + '秒'; }

function useHint(auto) {
  const r = state.round; if (!r || state.phase !== 'work') return;
  if (r.cover) {
    const cv = r.cover; const from = cv.kind === 'mop' ? cv.mop.position : cv.cloth.position; const t = cv.surf.nearestDirty(from.x, from.z); if (!t) return;
    if (auto) state.session.promptCount++; else state.session.questionCount++;
    cv.mark.position.set(t.x, (cv.kind === 'mop' ? 0.11 : cv.topY + 0.01), t.z); cv.mark.visible = true; r.hintShown = true; r.lastActionAt = performance.now();
    state.feedback = { text: 'ヒント：まだ ふいていない ところが 光っています', kind: 'ok' }; speak('まだ ふいていない ところが あります。');
    drawWorkBoard(); renderHud(); return;
  }

// 動き
const anims = [];
function animateDone(slot) { anims.push({ kind: 'done', slot, t0: performance.now() }); }
// ひろった 品物を 段ボール箱の 中へ（箱に 入ったまま 見えている）
function dropIntoBox(slot, k) {
  const it = slot.item; const from = slot.holder.position.clone().add(new THREE.Vector3(0, it.position.y, 0));
  slot.holder.remove(it); slot.mesh.remove(it); state.booth.workArea.add(it); it.position.copy(from); it.rotation.y = Math.PI;
  it.traverse((o) => { delete o.userData.slotIndex; });
  const to = new THREE.Vector3(PICK_BOX.x - 0.18 + (k % 3) * 0.18, 0.93, PICK_BOX.z + (k >= 3 ? 0.1 : -0.06));
  anims.push({ kind: 'box', obj: it, from, to, t0: performance.now() });
}
// 手に 持った 品物を、えらんだ たなの すきまへ（弧を えがいて 入り、正面を 通路に 向ける）
function putOnShelf(r, slot) {
  const it = r.held; r.carryLabel.visible = false; slot.holder.children.forEach((c) => { if (c.isSprite) c.visible = false; });
  const size = new THREE.Box3().setFromObject(it).getSize(new THREE.Vector3());
  const s1 = it.scale.x * Math.min(0.2 / size.x, 0.28 / size.y, 0.2 / size.z);
  let r1 = slot.face; while (r1 - it.rotation.y > Math.PI) r1 -= Math.PI * 2; while (it.rotation.y - r1 > Math.PI) r1 += Math.PI * 2; // 近い 向きへ まわす
  anims.push({ kind: 'shelve', obj: it, from: it.position.clone(), to: slot.gap.clone(), r0: it.rotation.y, r1, s0: it.scale.x, s1, t0: performance.now() });
}
function flashWrong(slot) {
  const mats = [];
  slot.mesh.traverse((o) => { if (o.isMesh && o.material.emissive) mats.push(o.material); });
  mats.forEach((m) => { if (!m.userData.baseEmissive) m.userData.baseEmissive = m.emissive.clone(); m.emissive.set('#c0392b'); });
  anims.push({ kind: 'wrong', slot, t0: performance.now(), mats });
}
function stepAnims(now) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; const t = (now - a.t0) / 1000;
    if (a.kind === 'done') {
      a.slot.holder.position.y += 0.012; a.slot.holder.scale.setScalar(Math.max(0.01, 1 - t * 2));
      if (t > 0.5) { a.slot.holder.visible = false; anims.splice(i, 1); }
    } else if (a.kind === 'box') {
      const u = Math.min(1, t / 0.55); const e = u * u * (3 - 2 * u);
      a.obj.position.lerpVectors(a.from, a.to, e); a.obj.position.y += Math.sin(u * Math.PI) * 0.35;
      if (u >= 1) anims.splice(i, 1);
    } else if (a.kind === 'shelve') {
      const u = Math.min(1, t / (reduceMotion ? 0.01 : 0.8)); const e = u * u * (3 - 2 * u);
      a.obj.position.lerpVectors(a.from, a.to, e); a.obj.position.y += Math.sin(Math.PI * e) * 0.25;
      a.obj.rotation.y = a.r0 + (a.r1 - a.r0) * e; a.obj.scale.setScalar(a.s0 + (a.s1 - a.s0) * e);
      if (u >= 1) anims.splice(i, 1);
    } else if (a.kind === 'fill') {
      const u = Math.min(1, t / 0.6); a.set(a.from + (a.to - a.from) * u);
      if (u >= 1) anims.splice(i, 1);
    } else if (a.kind === 'wrong') {
      a.slot.holder.position.x += Math.sin(t * 60) * 0.003;
      if (t > 0.4) { a.mats.forEach((m) => m.emissive.copy(m.userData.baseEmissive)); anims.splice(i, 1); }
    }
  }
}

// 読み上げ（配慮あり）
// ===========================================================================
function speak(text) {
  if (!state.withSupport || !('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.95; window.speechSynthesis.speak(u); } catch (e) { /* 読み上げなしで続ける */ }
}
function stopSpeech() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* noop */ } }

// ===========================================================================
// 入力：マウス・タッチ（見回し＋タップ）と VR コントローラー
// ===========================================================================
const look = { yaw: 0, pitch: 0 };
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let drag = null;

const coverPointer = (e) => { const rect = renderer.domElement.getBoundingClientRect(); pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1); raycaster.setFromCamera(pointer, camera); return coverRayHit(raycaster); };
let wiping = false; // 台ふきを 持って 動かしている あいだ（見回しは しない）
renderer.domElement.addEventListener('pointerdown', (e) => {
  renderer.domElement.setPointerCapture(e.pointerId);
  const r = state.round;
  if (r && r.cover && r.cover.kind === 'wipe' && state.phase === 'work') { const p = coverPointer(e); if (p) { wiping = true; drag = null; coverMoveCloth(r, p.x, p.z, performance.now()); return; } }
  drag = { x: e.clientX, y: e.clientY, yaw: look.yaw, pitch: look.pitch, moved: 0 };
});
renderer.domElement.addEventListener('pointermove', (e) => {
  const wr = state.round; const wipeNow = wr && wr.cover && wr.cover.kind === 'wipe' && state.phase === 'work';
  if (wiping || (drag && wipeNow && e.buttons)) { // 台の 外から ドラッグを はじめても、台の 上に 来たら ふける
    if (!wipeNow) { wiping = false; return; }
    const p = coverPointer(e); if (p) { wiping = true; drag = null; coverMoveCloth(wr, p.x, p.z, performance.now()); }
    if (wiping) return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x; const dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
  look.yaw = drag.yaw + dx * 0.005; look.pitch = Math.max(-1.1, Math.min(0.9, drag.pitch + dy * 0.004));
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (wiping) { wiping = false; return; }
  if (drag && drag.moved < 8) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    handleRay(raycaster);
  }
  drag = null;
});

function currentClickables() {
  if (state.where === 'plaza') return booths.map((b) => b.pin).concat(plazaClickables);
  if (state.where === 'walk') return plazaClickables;
  if (state.where === 'home') return home.btns ? Object.values(home.btns).concat(home.leisureBtns || []) : [];
  if (state.where === 'opening' || state.where === 'play') return [];
  if (state.where === 'furn') return (furnShop.btns || []).concat(furnShop.clickables); // 札の 下の ボタンも えらべる
  const b = state.booth; const list = Object.values(b.btns).filter((m) => m.visible);
  if (state.phase === 'work' && state.round) state.round.slots.forEach((s) => { if (!s.done && s.holder.visible) [s.mesh, s.extra].forEach((g) => g && g.traverse((o) => { if (o.isMesh) list.push(o); })); });
  return list; // お店の中では 壁ごしに ほかの お店を えらばない（もどるのは「島ぜんたいへ」）
}

function handleRay(ray) {
  const hits = ray.intersectObjects(currentClickables(), false);
  if (!hits.length) return;
  const obj = hits[0].object;
  if (obj.userData.furnBuy) { if (state.where === 'furn') buyFurn(obj.userData.furnBuy); return; }
  if (obj.userData.furnCancel) { furnShop.selected = null; paintFurnTags(); renderHud(); return; }
  if (obj.userData.furnId) { if (state.where === 'furn') pickFurn(obj.userData.furnId); return; }
  if (obj.userData.home) { goHome(); return; }
  if (state.where === 'home') { if (obj.userData.leisure) doLeisure(obj.userData.leisure); else if (obj === home.btns.out) exitHome(); else if (obj === home.btns.plaza) goPlaza(); return; }
  if (obj.userData.boothIndex !== undefined) { if (state.where === 'plaza' || state.phase !== 'work') goBooth(obj.userData.boothIndex); return; }
  if (obj.userData.slotIndex !== undefined) { onSelectItem(obj.userData.slotIndex); return; }
  const b = state.booth; if (!b) return;
  if (obj === b.btns.without) startSession(false);
  else if (obj === b.btns.with) startSession(true);
  else if (obj === b.btns.again) showChoose();
  else if (obj === b.btns.hint) useHint(false);
  else if (obj === b.btns.quit) quitWork();
  else if (obj === b.btns.back) goPlaza();
  else if (obj === b.btns.exit) exitToWalk();
  else { const k = Object.keys(b.btns).find((key) => b.btns[key] === obj); if (k && /^v\d$/.test(k)) pickVariant(Number(k.slice(1))); }
  renderHud();
}

// VR コントローラー
const tempMatrix = new THREE.Matrix4();
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -4)]), new THREE.LineBasicMaterial({ color: '#ffd23f' }));
  c.add(line);
  c.addEventListener('selectstart', () => { const r = state.round; if (r && r.cover && r.cover.kind === 'wipe') r.cover.ctrl = c; });
  c.addEventListener('selectend', () => { const r = state.round; if (r && r.cover && r.cover.ctrl === c) r.cover.ctrl = null; });

    '<p>あそびかたを かえても、いままでの バッジ・お金・家具は のこります。</p>' +
    '<div class="row"><button type="button" class="primary" id="st-save">保存</button><button type="button" id="st-move">引っ越し</button><button type="button" id="st-close">とじる</button></div>' +
    '<div class="field">スプレッドシートに 保存（デモ）</div><p>gas/Code.gs の ウェブアプリの URL と、利用者ID（本名ではなく 番号など）を 入れると、ほかの 端末でも つづきから あそべます。</p>' +
    '<input type="text" id="st-url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(cloud.url) + '" autocomplete="off">' +
    '<input type="text" id="st-id" placeholder="利用者ID（例：A001）" maxlength="32" value="' + esc(cloud.id) + '" autocomplete="off" style="margin-top:6px">' +
    '<div class="row"><button type="button" id="st-cloud">つないで 保存</button><button type="button" id="st-pull">スプレッドシートから 読みこむ</button></div>' +
    '<p id="st-cloud-status">' + esc(cloudStatus || (cloudOn() ? 'つながる 設定に なっています' : 'まだ つないで いません（このブラウザだけに 保存）')) + '</p>' +
    '<div class="row"><button type="button" id="st-reset">最初から やりなおす</button></div>',
  () => {
    $('st-save').onclick = () => {
      profile.name = $('st-name').value.trim() || profile.name; profile.gender = pickVal('st-g') || profile.gender; profile.mode = pickVal('st-m') || profile.mode;
      saveProfile(); buildHome(); renderWallet(); closeModal(); renderHud(); toast('保存しました');
    };
    $('st-move').onclick = () => openAreaPicker(false);
    const setCloud = () => { cloud.url = $('st-url').value.trim(); cloud.id = $('st-id').value.trim(); saveCloudCfg(); };
    $('st-cloud').onclick = () => { setCloud(); if (!cloudOn()) { $('st-cloud-status').textContent = 'URL と 利用者IDを 入れて ください'; return; } $('st-cloud-status').textContent = '保存中…'; cloudPost({ action: 'saveProfile', profile }).then(() => { $('st-cloud-status').textContent = cloudStatus; }); };
    $('st-pull').onclick = () => { setCloud(); $('st-cloud-status').textContent = '読みこみ中…'; cloudLoad(cloud.id).then((j) => { if (j && j.profile) { profile.updatedAt = ''; adoptCloudProfile(j.profile); renderHud(); $('st-cloud-status').textContent = '読みこみました（' + esc(profile.name) + 'さん）'; } else $('st-cloud-status').textContent = j ? 'この IDの 記録は ありません' : 'つながりません'; }); };
    $('st-close').onclick = closeModal;
    $('st-reset').onclick = () => {
      const b = $('st-reset');
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'もう一度 押すと 名前・バッジ・お金・家が 消えます'; return; }
      profile = null; try { localStorage.removeItem(PROFILE_KEY); } catch (e) { /* noop */ }
      buildHome(); renderWallet(); goPlaza(); openOpening();
    };
  });
}
// 買い物（お金モード）／もらえる もの（バッジのみモード）
function openShop() {
  if (!profile) return;
  modal.dataset.closable = '1';
  const money = profile.mode === 'money'; const nb = badgeCount();
  openModal('<h2>家具屋：' + (money ? 'かいもの' : 'もらえる もの') + '</h2><p>' + (money ? 'お金：' + yen(profile.money) + '。買った 家具は 家に とどけます。' : 'バッジ：' + nb + 'こ。バッジが ふえると もらえる 家具が ふえます。家に とどけます。') + '</p>' +
    '<div class="shop-grid">' + CATALOG.map((it) => {
      const own = profile.owned.includes(it.id);
      const can = money ? profile.money >= it.price : nb >= it.badges;
      const cost = money ? yen(it.price) : 'バッジ ' + it.badges + 'こ';
      const label = own ? 'もっている' : money ? (can ? '買う' : 'お金が たりない') : (can ? 'もらう' : 'あと ' + (it.badges - nb) + 'こ');
      return '<div class="item"><b>' + esc(it.name) + '</b><span>' + cost + '</span><button type="button" data-buy="' + it.id + '"' + (own || !can ? ' disabled' : ' class="primary"') + '>' + label + '</button></div>';
    }).join('') + '</div><div class="row"><button type="button" id="sh-close">とじる</button></div>',
  (card) => {
    card.querySelectorAll('[data-buy]:not([disabled])').forEach((btn) => {
      btn.onclick = () => {
        const it = CATALOG.find((c) => c.id === btn.dataset.buy);
        if (money) profile.money -= it.price;
        profile.owned.push(it.id); saveProfile(); refreshHome(); renderWallet(); renderHud();
        toast(it.name + 'を ' + (money ? '買いました' : 'もらいました') + '。家に 置きました'); openShop();
      };
    });
    $('sh-close').onclick = closeModal;
  });
}
// バッジ帳（お店ごとの バッジと、つぎの めやす）
function openBadgeBook() {
  if (!profile) return;
  modal.dataset.closable = '1';
  const next = ['最後まで やる（配慮ありでも OK）', 'ミス 1回までで 最後まで', '配慮なしで ミス 0・ヒント 0', 'そろいました'];
  openModal('<h2>バッジ帳</h2><p>銅：最後まで やる ／ 銀：ミス 1回まで ／ 金：配慮なしで ミス 0・ヒント 0（配慮ありは 銀まで）。全部の お店で そろうと トロフィー。</p>' +
    '<table class="badge-table"><tr><th>お店</th><th>バッジ</th><th>つぎの めやす</th></tr>' +
    JOBS.map((j) => { const lv = badgeOf(j.id); return '<tr><td>' + esc(j.name) + '</td><td><span class="medal" style="background:' + MEDAL_COLOR[lv] + '">' + MEDAL[lv] + '</span></td><td>' + next[lv] + '</td></tr>'; }).join('') +
    '</table><p>トロフィー：' + MEDAL[trophyLevel()] + '</p><div class="row"><button type="button" id="bb-close">とじる</button></div>',
  () => { $('bb-close').onclick = closeModal; });
}

// 記録
function loadLog() { try { return JSON.parse(localStorage.getItem('hope-vr-draft-log') || '[]'); } catch (e) { return []; } }
function saveLog() { try { localStorage.setItem('hope-vr-draft-log', JSON.stringify(logEntries.slice(0, 100))); } catch (e) { /* 保存できなくても続ける */ } }
function renderLog() {
  const t = $('log-table');
  if (!logEntries.length) { t.innerHTML = '<tr><td>まだ ありません。お店で 体験すると ここに 残ります。</td></tr>'; return; }
  t.innerHTML = '<tr><th>しごと</th><th>場面</th><th>できた</th><th>ミス</th><th>ヒント/ガイド</th><th>時間</th></tr>' +
    logEntries.map((e) => '<tr><td>' + esc(e.taskName) + '</td><td>' + (e.phase.withSupport ? '配慮あり' : '配慮なし') + '</td><td>' + e.phase.completed + '</td><td>' + e.phase.defects + '</td><td>' + e.phase.questionCount + ' / ' + e.phase.promptCount + '</td><td>' + fmtDuration(e.phase.durationSec) + '</td></tr>').join('');
}
function toggleLog(force) { const el = $('log'); el.hidden = force === undefined ? !el.hidden : !force; if (!el.hidden) renderLog(); }
$('btn-log').addEventListener('click', () => toggleLog());
$('btn-log-close').addEventListener('click', () => toggleLog(false));
$('btn-clear').addEventListener('click', () => {
  const b = $('btn-clear');
  if (b.dataset.armed) { logEntries = []; saveLog(); renderLog(); delete b.dataset.armed; b.textContent = 'きろくを消す'; toast('消しました'); return; }
  b.dataset.armed = '1'; b.textContent = 'もう一度押すと消します';
  setTimeout(() => { delete b.dataset.armed; b.textContent = 'きろくを消す'; }, 3000);
});
$('btn-copy').addEventListener('click', () => {
  const json = JSON.stringify(logEntries, null, 2); const ta = $('log-json');
  ta.value = json;
  const done = () => toast('コピーしました');
  const fallback = () => { ta.hidden = false; ta.focus(); ta.select(); toast('下の 文字を 選んで コピーしてください'); };
  try { navigator.clipboard.writeText(json).then(done, fallback); } catch (e) { fallback(); }
});

let toastTimer = null;
function toast(text) { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }

// ===========================================================================
// ループ
// ===========================================================================
function onResize() {
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.fov = camera.aspect < 1 ? 95 : 70; // 縦長（スマホ）では 広く 見せる
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastFrame = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (tween) {
    const t = Math.min(1, (now - tween.t0) / tween.dur); const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    rig.position.lerpVectors(tween.from.p, tween.to.p, e); rig.rotation.y = tween.from.yaw + (tween.to.yaw - tween.from.yaw) * e;
    if (t >= 1) tween = null;
  }
  if (!renderer.xr.isPresenting) { camera.rotation.y = look.yaw; camera.rotation.x = -look.pitch; }
  walkStep(dt);
  stepFurn(dt);
  stepPlay(dt, now);
  stepCover(dt, now);
  stepOpening(now);
  updateSnow(dt, now);
  // 配慮あり：しばらく手が止まったら、つぎに選ぶものを光らせる（声かけ 1 回として数える）
  const r = state.round;
  if (r && state.phase === 'work' && state.withSupport && (!r.hintShown || (r.cover && !r.cover.mark.visible)) && (now - r.lastActionAt) / 1000 > AUTO_HINT_SEC) useHint(true);
  if (r && r.cover && r.cover.mark.visible) { const k = 1 + Math.sin(now / 180) * 0.15; r.cover.mark.scale.set(k, k, k); }
  if (r) r.slots.forEach((s) => { if (s.ring.visible) { const k = 1 + Math.sin(now / 180) * 0.12; s.ring.scale.set(k, k, k); } });
  if (!reduceMotion) windRotors.forEach((r) => { r.rotation.z = -(now / 1000) * 1.4 - r.userData.phase; });
  stepAnims(now);
  if (now - (drawMinimap.last || 0) > 100) { drawMinimap.last = now; drawMinimap(); } // 地図は 1 秒に 10 回で じゅうぶん
  renderer.render(scene, camera);
});

renderChips();
placeMinimap();
renderHud();
renderLog();
updateChipNav();
// スマホの 歩くボタン（押している 間だけ 歩く）
document.querySelectorAll('#pad button').forEach((btn) => {
  const set = (v) => (e) => { e.preventDefault(); walkKeys[btn.dataset.key] = v; syncPad(); };
  btn.addEventListener('pointerdown', set(true));
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => btn.addEventListener(t, set(false)));
});
$('btn-walk').addEventListener('click', () => { if (state.where === 'walk') goPlaza(); else startWalk(); });
applySeason();
$('btn-season').addEventListener('click', () => setSeason(season === 'winter' ? 'summer' : 'winter'));
// 動作確認用（テストから 作業を 進めるため）
$('btn-home').addEventListener('click', () => goHome());
$('btn-settings').addEventListener('click', openSettings);
window.hopeTown = {
  state, goBooth, pickVariant, startSession, select: onSelectItem, nextTargetKey, setSeason, startWalk, exitToWalk, walkKeys, rig, look, walkable, booths, goHome, exitHome, goPlaza,
  get profile() { return profile; }, quitWork, doLeisure, LEISURE, home, FURN, goFurniture, furnShop, pickFurn, exitFurniture, cheatCover() { const r = state.round; if (r && r.cover) { r.cover.surf.clearAll(); coverProgress(r, 1, performance.now()); } }, seasonal, LAKE, toWorld, nearbyActions, openShop, openBadgeBook, openSettings, openAreaPicker,
  // テスト用：オープニングを とばして 家を 用意する
  quickStart(homeKey, mode) { profile = { name: 'テスト', gender: 'n', mode: mode || 'money', home: homeKey || 'downtown', money: 0, badges: {}, owned: [], since: new Date().toISOString() }; saveProfile(); closeModal(); buildHome(); renderWallet(); goPlaza(); },
};
// 最初は 島ぜんたいを 見わたす。名前が まだ なら オープニング、家が あれば 家から 出発
rig.position.copy(OVERVIEW.pos); rig.rotation.y = OVERVIEW.yaw; look.pitch = OVERVIEW.pitch;
buildHome(); renderWallet();
if (profile && cloudOn()) cloudLoad(cloud.id).then((j) => { if (j && j.profile && adoptCloudProfile(j.profile) && state.where === 'home') goHome(true); });
if (!profile) openOpening();
else if (home.group) goHome(true);
else openAreaPicker(true);
if (document.fonts && document.fonts.ready) {
  // フォントが届いてから看板・掲示板を描きなおす
  document.fonts.ready.then(() => { if (state.where === 'booth') { if (state.phase === 'choose' || state.phase === 'pick') showChoose(); else if (state.phase === 'work') drawWorkBoard(); } });
}
}

// 看板の文字を正しいフォントで描くため、フォントが届いてから町を建てる（2 秒で見切る）。
(function boot() {
  const wait = document.fonts && document.fonts.load
    ? Promise.all(['700 40px "Zen Maru Gothic"', '400 40px "BIZ UDPGothic"', '700 40px "BIZ UDPGothic"'].map((f) => document.fonts.load(f, 'しごと')))
    : Promise.resolve();
  let started = false;
  const go = () => { if (!started) { started = true; main(); } };
  Promise.race([wait, new Promise((r) => setTimeout(r, 2000))]).then(go, go);
})();
</script>
